<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
* {
    font-family: 'Cairo', Tahoma, Arial, sans-serif;
    font-weight: 500;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}
body {
    background: #1a1a1a;
}

/* Phone Frame for Desktop */
@media (min-width: 768px) {
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e1b4b 100%);
        padding: 20px;
    }
    .phone-frame {
        width: 100%;
        max-width: 420px;
        height: 90vh;
        max-height: 900px;
        background: #000;
        border-radius: 40px;
        padding: 12px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 0 2px #2d3748;
        position: relative;
    }
    .phone-frame::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 28px;
        background: #000;
        border-radius: 0 0 18px 18px;
        z-index: 100;
    }
    .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        position: relative;
        background: #0f172a;
    }
    .app-wrapper {
        width: 100%;
        height: 100%;
    }
}

/* Mobile Full Screen */
@media (max-width: 767px) {
    .phone-frame {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border-radius: 0;
    }
    .phone-screen {
        border-radius: 0;
        height: 100vh;
    }
    .app-wrapper {
        width: 100%;
        height: 100%;
    }
}

.app-wrapper {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
}

.scroll-hide::-webkit-scrollbar {
    width: 5px;
}
.scroll-hide::-webkit-scrollbar-track {
    background: transparent;
}
.scroll-hide::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 3px;
}

.owner-name {
    background: linear-gradient(90deg, #f59e0b, #ef4444, #8b5cf6, #3b82f6, #10b981, #f59e0b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient-flow 3s linear infinite;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
@keyframes gradient-flow {
    to { background-position: -200% center; }
}

.message-anim {
    animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.glass {
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(148, 163, 184, 0.1);
}

.badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
}

.modal-bg {
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
}

#messagesContainer {
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
    overflow-y: auto;
    overflow-x: hidden;
}

.chat-main {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
}

.messages-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.input-area {
    flex-shrink: 0;
}

#messageInput {
    direction: rtl;
    text-align: right;
}
</style>

            <button onclick="switchLoginType('owner')" id="tab-owner" class="login-tab flex-1 py-2 rounded-lg text-xs font-semibold transition">

        <div id="login-guest" class="login-form">
            <input type="text" id="guestName" placeholder="ادخل اسمك كزائر" class="w-full mb-3 px-4 py-2.5 bg-slate-800/80 rounded-xl border border-slate-700 focus:border-indigo-500 focus:outline-none transition text-sm">
            <button onclick="loginAsGuest()" class="w-full py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 rounded-xl font-semibold hover:shadow-lg transition text-sm">

            </button>
        </div>

        <div id="login-member" class="login-form hidden">
            <input type="text" id="memberName" placeholder="اسم المستخدم" class="w-full mb-2.5 px-4 py-2.5 bg-slate-800/80 rounded-xl border border-slate-700 focus:border-indigo-500 focus:outline-none transition text-sm">

            <input type="password" id="ownerCode" placeholder="رمز المالك" class="w-full mb-3 px-4 py-2.5 bg-slate-800/80 rounded-xl border border-slate-700 focus:border-indigo-500 focus:outline-none transition text-sm">
            <button onclick="loginAsOwner()" class="w-full py-2.5 bg-gradient-to-r from-amber-600 to-orange-600 rounded-xl font-semibold hover:shadow-lg transition text-sm">

</div>

                <button onclick="setRoomTheme('#701a75')" class="h-9 rounded-lg bg-fuchsia-950 border-2 border-slate-700 hover:scale-110 transition"></button>
                <button onclick="setRoomTheme('#831843')" class="h-9 rounded-lg bg-pink-950 border-2 border-slate-700 hover:scale-110 transition"></button>
                <button onclick="setRoomTheme('#1e3a8a')" class="h-9 rounded-lg bg-blue-950 border-2 border-slate-700 hover:scale-110 transition"></button>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold mb-2">لوحة الترحيب</label>
            <textarea id="roomWelcomeInput" placeholder="نص الترحيب الخاص بالغرفة..." class="w-full px-3 py-2 bg-slate-800/80 rounded-lg border border-slate-700 focus:border-indigo-500 focus:outline-none resize-none text-sm" rows="3"></textarea>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold mb-2">إحصائيات الغرفة</label>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-800/50 rounded-lg p-2.5 text-center">
                    <div class="text-xl font-bold text-indigo-400" id="statsMessages">0</div>
                    <div class="text-xs text-slate-400">الرسائل</div>
                </div>
                <div class="bg-slate-800/50 rounded-lg p-2.5 text-center">
                    <div class="text-xl font-bold text-green-400" id="statsUsers">0</div>
                    <div class="text-xs text-slate-400">الأعضاء</div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <button onclick="deleteRoom()" class="w-full py-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 rounded-lg font-semibold transition border border-red-600/50 text-sm">
                <i class="fa-solid fa-trash"></i> حذف الغرفة
            </button>
        </div>

        <button onclick="saveRoomSettings()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition text-sm">
            حفظ الإعدادات
        </button>
    </div>
</div>

<div id="userRoleModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" onclick="if(event.target==this) closeUserRoleModal()">
    <div class="glass rounded-2xl p-5 w-full max-w-xs" onclick="event.stopPropagation()">
        <h3 class="text-lg font-bold mb-3">تغيير رتبة المستخدم</h3>
        <p class="text-slate-400 text-xs mb-3" id="roleUserName"></p>
        <div class="space-y-1.5 mb-3">
            <button onclick="setUserRole('member')" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition text-right text-sm">
                <i class="fa-solid fa-user text-slate-400 ml-2"></i> عضو
            </button>
            <button onclick="setUserRole('admin')" class="w-full py-2.5 bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-400 rounded-lg transition text-right text-sm">
                <i class="fa-solid fa-shield text-cyan-400 ml-2"></i> ادمن
            </button>
            <button onclick="setUserRole('superadmin')" class="w-full py-2.5 bg-purple-600/20 hover:bg-purple-600/30 text-purple-400 rounded-lg transition text-right text-sm">
                <i class="fa-solid fa-star text-purple-400 ml-2"></i> سوبر ادمن
            </button>
            <button onclick="setUserRole('master')" class="w-full py-2.5 bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 rounded-lg transition text-right text-sm">
                <i class="fa-solid fa-crown text-amber-400 ml-2"></i> ماستر
            </button>
        </div>
        <button onclick="closeUserRoleModal()" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition text-sm">
            إلغاء
        </button>
    </div>
</div>

<div id="welcomeEditModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" onclick="if(event.target==this) closeWelcomeEdit()">
    <div class="glass rounded-2xl p-5 w-full max-w-sm" onclick="event.stopPropagation()">
        <h3 class="text-lg font-bold mb-3">تعديل الشريط الترحيبي</h3>
        <textarea id="welcomeTextInput" placeholder="نص الترحيب العام..." class="w-full mb-3 px-3 py-2 bg-slate-800/80 rounded-lg border border-slate-700 focus:border-indigo-500 focus:outline-none resize-none text-sm" rows="3"></textarea>
        <div class="flex gap-2">
            <button onclick="saveGlobalWelcome()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition text-sm">
                حفظ
            </button>
            <button onclick="closeWelcomeEdit()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition text-sm">
                إلغاء
            </button>
        </div>
    </div>
</div>

        </div>
    </div>
</div>

<script>
const OWNER_CODE = "19952005";
const COUNTRIES = {
    iq: { name: "العراق", flag: "🇮🇶" },
    sa: { name: "السعودية", flag: "🇸🇦" },
    eg: { name: "مصر", flag: "🇪🇬" },
    ae: { name: "الإمارات", flag: "🇦🇪" },
    jo: { name: "الأردن", flag: "🇯🇴" },
    ma: { name: "المغرب", flag: "🇲🇦" },
    ps: { name: "فلسطين", flag: "🇵🇸" },
    lb: { name: "لبنان", flag: "🇱🇧" },
    kw: { name: "الكويت", flag: "🇰🇼" },
    qa: { name: "قطر", flag: "🇶🇦" },
    om: { name: "عمان", flag: "🇴🇲" },
    bh: { name: "البحرين", flag: "🇧🇭" },
    sy: { name: "سوريا", flag: "🇸🇾" },
    ye: { name: "اليمن", flag: "🇾🇪" },
    dz: { name: "الجزائر", flag: "🇩🇿" },
    tn: { name: "تونس", flag: "🇹🇳" },
    ly: { name: "ليبيا", flag: "🇱🇾" }
};

let currentUser = null;
let currentRoomId = "general";
let selectedUserId = null;
let data = {
    users: [],
    rooms: [],
    messages: {},
    settings: {
        globalWelcome: "مرحباً بكم في شات عربي - أكبر تجمع عربي للدردشة"
    }
};

function init() {
    loadData();
    if (data.rooms.length === 0) {
        createDefaultRooms();
    }
    if (currentUser) {
        showMainApp();
    }
}

function loadData() {
    const saved = localStorage.getItem('arabicChatData');
    if (saved) {
        data = JSON.parse(saved);
    }
    const savedUser = localStorage.getItem('arabicChatUser');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
    }
}

function saveData() {
    localStorage.setItem('arabicChatData', JSON.stringify(data));
}

function saveUser() {
    localStorage.setItem('arabicChatUser', JSON.stringify(currentUser));
}

function switchLoginType(type) {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('bg-indigo-600'));
    document.querySelectorAll('.login-form').forEach(f => f.classList.add('hidden'));
    document.getElementById('tab-' + type).classList.add('bg-indigo-600');
    document.getElementById('login-' + type).classList.remove('hidden');
}

function loginAsGuest() {
    const name = document.getElementById('guestName').value.trim();
    if (!name) return alert('الرجاء إدخال اسم');
    currentUser = {
        id: 'guest_' + Date.now(),
        name: name,
        type: 'guest',
        role: 'guest'
    };
    addUserToData();
    saveUser();
    showMainApp();
}

function loginAsMember() {
    const name = document.getElementById('memberName').value.trim();
    const pass = document.getElementById('memberPass').value;
    if (!name || !pass) return alert('الرجاء إدخال جميع البيانات');
    
    const user = data.users.find(u => u.name === name && u.password === pass);
    if (!user) return alert('اسم المستخدم أو كلمة المرور غير صحيحة');
    
    currentUser = user;
    saveUser();
    showMainApp();
}

function registerMember() {
    const name = document.getElementById('memberName').value.trim();
    const pass = document.getElementById('memberPass').value;
    if (!name || !pass) return alert('الرجاء إدخال جميع البيانات');
    if (pass.length < 4) return alert('كلمة المرور قصيرة جداً');
    
    if (data.users.find(u => u.name === name)) {
        return alert('اسم المستخدم موجود مسبقاً');
    }
    
    currentUser = {
        id: 'member_' + Date.now(),
        name: name,
        password: pass,
        type: 'member',
        role: 'member',
        joinDate: Date.now()
    };
    addUserToData();
    saveUser();
    showMainApp();
}

function loginAsOwner() {
    const name = document.getElementById('ownerName').value.trim();
    const code = document.getElementById('ownerCode').value;
    if (code !== OWNER_CODE) return alert('رمز المالك غير صحيح');
    if (!name) return alert('الرجاء إدخال اسم');
    
    currentUser = {
        id: 'owner_' + Date.now(),
        name: name,
        type: 'owner',
        role: 'owner'
    };
    addUserToData();
    saveUser();
    showMainApp();
}

function addUserToData() {
    if (!data.users.find(u => u.id === currentUser.id)) {
        data.users.push({ ...currentUser });
        saveData();
    }
}

function logout() {
    if (confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem('arabicChatUser');
        currentUser = null;
        location.reload();
    }
}

function showMainApp() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    updateHeader();
    renderRooms();
    renderUsers();
    loadRoom(currentRoomId);
    updateGlobalWelcome();
    
    if (currentUser.role === 'owner') {
        document.getElementById('createRoomBtn').classList.remove('hidden');
        document.getElementById('editWelcomeBtn').classList.remove('hidden');
        document.getElementById('roomSettingsBtn').classList.remove('hidden');
    }
}

function updateHeader() {
    const nameEl = document.getElementById('headerUserName');
    const roleEl = document.getElementById('headerUserRole');
    
    if (currentUser.role === 'owner') {
        nameEl.innerHTML = `<span class="owner-name"><i class="fa-solid fa-crown text-xs"></i>${currentUser.name}</span>`;
        roleEl.textContent = 'مالك التطبيق';
    } else {
        nameEl.textContent = currentUser.name;
        roleEl.textContent = getRoleName(currentUser.role);
    }
}

function getRoleName(role) {
    const roles = {
        guest: 'زائر',
        member: 'عضو',
        admin: 'ادمن',
        superadmin: 'سوبر ادمن',
        master: 'ماستر',
        owner: 'مالك'
    };
    return roles[role] || 'عضو';
}

function createDefaultRooms() {
    data.rooms = [
        {
            id: 'general',
            name: 'الغرفة العامة',
            country: 'iq',
            color: '#0f172a',
            welcome: 'مرحباً بكم في الغرفة العامة',
            created: Date.now()
        }
    ];
    data.messages.general = [];
    saveData();
}

function renderRooms() {
    const list = document.getElementById('roomsList');
    list.innerHTML = data.rooms.map(room => {
        const isActive = room.id === currentRoomId;
        const country = COUNTRIES[room.country];
        return `
            <div onclick="loadRoom('${room.id}')" class="p-2.5 rounded-lg mb-1.5 cursor-pointer transition ${isActive ? 'bg-indigo-600/20 border border-indigo-500/50' : 'hover:bg-slate-700/50'}">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <span class="text-xl">${country.flag}</span>
                        <div class="min-w-0 flex-1">
                            <div class="font-semibold text-xs truncate">${room.name}</div>
                            <div class="text-xs text-slate-400">${country.name}</div>
                        </div>
                    </div>
                    <div class="text-xs bg-slate-700/50 px-1.5 py-0.5 rounded-full">
                        ${(data.messages[room.id] || []).length}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function loadRoom(roomId) {
    currentRoomId = roomId;
    const room = data.rooms.find(r => r.id === roomId);
    if (!room) return;
    
    document.getElementById('currentRoomName').textContent = room.name;
    document.getElementById('chatContainer').style.background = `linear-gradient(135deg, ${room.color} 0%, #1e293b 100%)`;
    
    if (room.welcome) {
        document.getElementById('roomWelcome').classList.remove('hidden');
        document.getElementById('roomWelcomeText').textContent = room.welcome;
        if (currentUser.role === 'owner') {
            document.getElementById('editRoomWelcomeBtn').classList.remove('hidden');
        }
    } else {
        document.getElementById('roomWelcome').classList.add('hidden');
    }
    
    renderMessages();
    renderRooms();
    closeRoomsSidebar();
}

function showCreateRoomModal() {
    document.getElementById('createRoomModal').classList.remove('hidden');
    document.getElementById('newRoomName').value = '';
}

function closeCreateRoomModal() {
    document.getElementById('createRoomModal').classList.add('hidden');
}

function createRoom() {
    const name = document.getElementById('newRoomName').value.trim();
    const country = document.getElementById('newRoomCountry').value;
    if (!name) return alert('الرجاء إدخال اسم الغرفة');
    
    const room = {
        id: 'room_' + Date.now(),
        name: name,
        country: country,
        color: '#0f172a',
        welcome: '',
        created: Date.now()
    };
    
    data.rooms.push(room);
    data.messages[room.id] = [];
    saveData();
    renderRooms();
    closeCreateRoomModal();
    loadRoom(room.id);
}

function deleteRoom() {
    if (currentRoomId === 'general') {
        return alert('لا يمكن حذف الغرفة العامة');
    }
    if (confirm('هل أنت متأكد من حذف هذه الغرفة؟')) {
        data.rooms = data.rooms.filter(r => r.id !== currentRoomId);
        delete data.messages[currentRoomId];
        saveData();
        closeRoomSettings();
        loadRoom('general');
        renderRooms();
    }
}

function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;
    
    const message = {
        id: 'msg_' + Date.now(),
        userId: currentUser.id,
        userName: currentUser.name,
        userRole: currentUser.role,
        text: text,
        timestamp: Date.now()
    };
    
    if (!data.messages[currentRoomId]) {
        data.messages[currentRoomId] = [];
    }
    data.messages[currentRoomId].push(message);
    saveData();
    input.value = '';
    renderMessages();
}

function renderMessages() {
    const container = document.getElementById('messagesContainer');
    const messages = data.messages[currentRoomId] || [];
    
    if (messages.length === 0) {
        container.innerHTML = `
            <div class="text-center text-slate-500 text-xs pt-10">
                <i class="fa-solid fa-face-smile text-3xl mb-2 block"></i>
                ابدأ المحادثة الآن!
            </div>
        `;
        return;
    }
    
    container.innerHTML = messages.map(msg => {
        const isOwn = msg.userId === currentUser.id;
        const time = new Date(msg.timestamp).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
        const isOwner = msg.userRole === 'owner';
        
        return `
            <div class="message-anim flex ${isOwn ? 'justify-start' : 'justify-end'}">
                <div class="max-w-[75%] ${isOwn ? 'order-2' : 'order-1'}">
                    <div class="mb-1 text-xs text-slate-400 ${isOwn ? 'text-right' : 'text-left'}">
                        ${isOwner ? `<span class="owner-name"><i class="fa-solid fa-crown text-xs"></i>${msg.userName}</span>` : msg.userName}
                        <span class="badge ${getRoleBadgeClass(msg.userRole)}">${getRoleName(msg.userRole)}</span>
                    </div>
                    <div class="px-3 py-2 rounded-2xl ${isOwn ? 'bg-indigo-600 rounded-tr-sm' : 'glass rounded-tl-sm'} shadow-lg">
                        <div class="text-sm break-words leading-relaxed" style="text-align: right; direction: rtl;">${msg.text}</div>
                        <div class="text-xs opacity-60 mt-0.5 text-left">${time}</div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    setTimeout(() => {
        container.scrollTop = container.scrollHeight;
    }, 0);
}

function getRoleBadgeClass(role) {
    const classes = {
        guest: 'bg-slate-600 text-slate-200',
        member: 'bg-slate-600 text-slate-200',
        admin: 'bg-cyan-600/30 text-cyan-300',
        superadmin: 'bg-purple-600/30 text-purple-300',
        master: 'bg-amber-600/30 text-amber-300',
        owner: 'bg-gradient-to-r from-amber-500 to-orange-500 text-white'
    };
    return classes[role] || classes.member;
}

function renderUsers() {
    const list = document.getElementById('usersList');
    const onlineUsers = [currentUser, ...data.users.filter(u => u.id !== currentUser.id)].slice(0, 20);
    
    document.getElementById('onlineCount').textContent = onlineUsers.length;
    
    list.innerHTML = onlineUsers.map(user => {
        const isOwner = user.role === 'owner';
        const canEditRole = currentUser.role === 'owner' && user.id !== currentUser.id;
        
        return `
            <div class="p-2 rounded-lg mb-1 hover:bg-slate-700/50 transition ${canEditRole ? 'cursor-pointer' : ''}" ${canEditRole ? `onclick="showUserRoleModal('${user.id}')"` : ''}>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <div class="w-7 h-7 bg-gradient-to-br from-indigo-600 to-violet-600 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0">
                            ${user.name.charAt(0)}
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="font-semibold text-xs truncate">
                                ${isOwner ? `<span class="owner-name"><i class="fa-solid fa-crown text-xs"></i>${user.name}</span>` : user.name}
                            </div>
                            <div class="text-xs text-slate-400">${getRoleName(user.role)}</div>
                        </div>
                    </div>
                    <div class="w-2 h-2 bg-green-500 rounded-full flex-shrink-0"></div>
                </div>
            </div>
        `;
    }).join('');
}

function showUserRoleModal(userId) {
    selectedUserId = userId;
    const user = data.users.find(u => u.id === userId);
    document.getElementById('roleUserName').textContent = user.name;
    document.getElementById('userRoleModal').classList.remove('hidden');
}

function closeUserRoleModal() {
    document.getElementById('userRoleModal').classList.add('hidden');
    selectedUserId = null;
}

function setUserRole(role) {
    if (!selectedUserId) return;
    const user = data.users.find(u => u.id === selectedUserId);
    user.role = role;
    saveData();
    closeUserRoleModal();
    renderUsers();
    renderMessages();
}

function showRoomSettings() {
    const room = data.rooms.find(r => r.id === currentRoomId);
    document.getElementById('roomWelcomeInput').value = room.welcome || '';
    document.getElementById('statsMessages').textContent = (data.messages[currentRoomId] || []).length;
    document.getElementById('statsUsers').textContent = data.users.length;
    document.getElementById('roomSettingsModal').classList.remove('hidden');
}

function closeRoomSettings() {
    document.getElementById('roomSettingsModal').classList.add('hidden');
}

function setRoomTheme(color) {
    const room = data.rooms.find(r => r.id === currentRoomId);
    room.color = color;
    saveData();
    document.getElementById('chatContainer').style.background = `linear-gradient(135deg, ${color} 0%, #1e293b 100%)`;
}

function saveRoomSettings() {
    const room = data.rooms.find(r => r.id === currentRoomId);
    room.welcome = document.getElementById('roomWelcomeInput').value.trim();
    saveData();
    closeRoomSettings();
    loadRoom(currentRoomId);
}

function editRoomWelcome() {
    showRoomSettings();
}

function updateGlobalWelcome() {
    if (data.settings.globalWelcome) {
        document.getElementById('globalWelcomeBar').classList.remove('hidden');
        document.getElementById('globalWelcomeText').textContent = data.settings.globalWelcome;
    }
}

function editGlobalWelcome() {
    document.getElementById('welcomeTextInput').value = data.settings.globalWelcome;
    document.getElementById('welcomeEditModal').classList.remove('hidden');
}

function closeWelcomeEdit() {
    document.getElementById('welcomeEditModal').classList.add('hidden');
}

function saveGlobalWelcome() {
    data.settings.globalWelcome = document.getElementById('welcomeTextInput').value.trim();
    saveData();
    updateGlobalWelcome();
    closeWelcomeEdit();
}

function toggleRoomsSidebar() {
    const sidebar = document.getElementById('roomsSidebar');
    sidebar.classList.toggle('-mr-64');
    sidebar.classList.toggle('mr-0');
}

function closeRoomsSidebar() {
    document.getElementById('roomsSidebar').classList.add('-mr-64');
    document.getElementById('roomsSidebar').classList.remove('mr-0');
}

function toggleUsersSidebar() {
    const sidebar = document.getElementById('usersSidebar');
    sidebar.classList.toggle('-ml-64');
    sidebar.classList.toggle('ml-0');
}

init();
</script>
</body>
</html>
