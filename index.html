<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomRom - Master System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
       .room-card { transition: all 0.3s; }
       .room-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-700 min-h-screen p-4">
    <div id="app" class="w-full max-w-6xl mx-auto"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, push, onValue, remove, set, update, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const MASTER_CODE = "19952005"; // رمز الماستر

        const firebaseConfig = {
          apiKey: "AIzaSyAGpES78mV7-jgEQzi63R0TONGKfUQHFHc",
          authDomain: "hashed-cht.firebaseapp.com",
          databaseURL: "https://hashed-cht-default-rtdb.firebaseio.com",
          projectId: "hashed-cht",
          storageBucket: "hashed-cht.firebasestorage.app",
          messagingSenderId: "442699332645",
          appId: "1:442699332645:web:08d332758ac215a07453cc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const appDiv = document.getElementById('app');

        let currentUser = { role: 'guest', name: 'ضيف' };
        let currentCountry = null;
        let currentRoom = null;

        signInAnonymously(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser.uid = user.uid;
                showMainMenu();
            }
        });

        function showMainMenu() {
            appDiv.innerHTML = `
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 text-white">
                    <div class="text-center mb-8">
                        <h1 class="text-4xl font-bold mb-2 text-purple-400">RoomRom System</h1>
                        <p class="text-slate-300">نظام دول وغرف متكامل</p>
                        <div class="mt-4 text-sm">
                            ${currentUser.role === 'master'? 
                                '<span class="bg-yellow-500 text-black px-4 py-1 rounded-full"><i class="fa-solid fa-crown"></i> الماستر</span>' : 
                                currentUser.role === 'admin'? 
                                '<span class="bg-blue-500 px-4 py-1 rounded-full"><i class="fa-solid fa-shield"></i> مشرف</span>' :
                                '<span class="bg-slate-600 px-4 py-1 rounded-full">عضو</span>'
                            }
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 mb-6">
                        <button onclick="enterAsMember()" class="bg-purple-600 hover:bg-purple-700 p-6 rounded-xl font-bold text-lg">
                            <i class="fa-solid fa-users text-3xl mb-2"></i><br>دخول كعضو
                        </button>
                        <button onclick="showMasterLogin()" class="bg-yellow-600 hover:bg-yellow-700 text-black p-6 rounded-xl font-bold text-lg">
                            <i class="fa-solid fa-crown text-3xl mb-2"></i><br>دخول الماستر
                        </button>
                    </div>

                    <div id="countriesList" class="grid md:grid-cols-3 gap-4"></div>
                </div>
            `;
            loadCountries();
        }

        window.showMasterLogin = () => {
            appDiv.innerHTML = `
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-md mx-auto text-white">
                    <h2 class="text-2xl font-bold mb-6 text-center text-yellow-400">دخول الماستر</h2>
                    <input id="masterCode" type="password" placeholder="ادخل رمز الماستر" class="w-full p-3 mb-4 rounded-lg text-black text-center text-xl">
                    <button onclick="checkMaster()" class="w-full bg-yellow-600 text-black p-3 rounded-lg font-bold mb-2">دخول</button>
                    <button onclick="showMainMenu()" class="w-full bg-slate-600 p-3 rounded-lg">رجوع</button>
                    <p id="masterError" class="text-red-400 text-sm mt-3 text-center"></p>
                </div>
            `;
        };

        window.checkMaster = () => {
            const code = document.getElementById('masterCode').value;
            if(code === MASTER_CODE){
                currentUser = { uid: auth.currentUser.uid, role: 'master', name: 'الماستر' };
                showMasterPanel();
            } else {
                document.getElementById('masterError').textContent = 'الرمز غلط';
            }
        };

        window.enterAsMember = () => {
            const name = prompt('اكتب اسمك:');
            if(name) {
                currentUser = { uid: auth.currentUser.uid, role: 'member', name: name };
                showMainMenu();
            }
        };

        function showMasterPanel() {
            appDiv.innerHTML = `
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-6 text-white">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-yellow-400"><i class="fa-solid fa-crown"></i> لوحة تحكم الماستر</h2>
                        <button onclick="showMainMenu()" class="bg-slate-600 px-4 py-2 rounded">رجوع</button>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-700 p-4 rounded-xl">
                            <h3 class="font-bold mb-3">انشاء دولة جديدة</h3>
                            <input id="countryName" placeholder="اسم الدولة" class="w-full p-2 mb-2 rounded text-black">
                            <input id="countryFlag" placeholder="علم الدولة 🇮🇶" class="w-full p-2 mb-2 rounded text-black">
                            <button onclick="createCountry()" class="w-full bg-green-600 p-2 rounded font-bold">انشاء</button>
                        </div>
                        
                        <div class="bg-slate-700 p-4 rounded-xl">
                            <h3 class="font-bold mb-3">احصائيات</h3>
                            <div id="stats" class="space-y-2 text-sm"></div>
                        </div>
                    </div>

                    <h3 class="font-bold mb-3 text-xl">الدول الحالية:</h3>
                    <div id="adminCountriesList" class="grid md:grid-cols-3 gap-4"></div>
                </div>
            `;
            loadCountriesAdmin();
            loadStats();
        }

        window.createCountry = async () => {
            const name = document.getElementById('countryName').value;
            const flag = document.getElementById('countryFlag').value;
            if(!name) return alert('اكتب اسم الدولة');
            
            await push(ref(db, 'countries'), {
                name: name,
                flag: flag || '🌍',
                createdAt: Date.now(),
                createdBy: 'master'
            });
            document.getElementById('countryName').value = '';
            document.getElementById('countryFlag').value = '';
            loadCountriesAdmin();
        };

        function loadCountries() {
            onValue(ref(db, 'countries'), snap => {
                const countries = snap.val();
                let html = '';
                for(let id in countries){
                    const c = countries[id];
                    html += `
                        <div onclick="openCountry('${id}')" class="room-card bg-slate-700 p-6 rounded-xl cursor-pointer hover:bg-slate-600">
                            <div class="text-4xl mb-2">${c.flag}</div>
                            <div class="font-bold text-lg">${c.name}</div>
                            <div class="text-xs text-slate-400 mt-2">اضغط للدخول</div>
                        </div>
                    `;
                }
                document.getElementById('countriesList').innerHTML = html || '<p class="text-center col-span-3 text-slate-400">لا توجد دول بعد</p>';
            });
        }

        function loadCountriesAdmin() {
            onValue(ref(db, 'countries'), snap => {
                const countries = snap.val();
                let html = '';
                for(let id in countries){
                    const c = countries[id];
                    html += `
                        <div class="bg-slate-700 p-4 rounded-xl">
                            <div class="text-3xl mb-2">${c.flag}</div>
                            <div class="font-bold mb-3">${c.name}</div>
                            <div class="flex gap-2">
                                <button onclick="manageCountry('${id}')" class="flex-1 bg-blue-600 p-2 rounded text-xs">ادارة</button>
                                <button onclick="deleteCountry('${id}')" class="bg-red-600 p-2 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('adminCountriesList').innerHTML = html;
            });
        }

        window.openCountry = (countryId) => {
            currentCountry = countryId;
            showRooms(countryId);
        };

        window.manageCountry = (countryId) => {
            currentCountry = countryId;
            showRoomsAdmin(countryId);
        };

        function showRooms(countryId) {
            get(ref(db, `countries/${countryId}`)).then(snap => {
                const country = snap.val();
                appDiv.innerHTML = `
                    <div class="bg-slate-800 rounded-2xl shadow-2xl p-6 text-white">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">${country.flag} ${country.name}</h2>
                            <button onclick="showMainMenu()" class="bg-slate-600 px-4 py-2 rounded">رجوع للدول</button>
                        </div>
                        <div id="roomsList" class="grid md:grid-cols-4 gap-4"></div>
                    </div>
                `;
                loadRooms(countryId);
            });
        }

        function showRoomsAdmin(countryId) {
            get(ref(db, `countries/${countryId}`)).then(snap => {
                const country = snap.val();
                appDiv.innerHTML = `
                    <div class="bg-slate-800 rounded-2xl shadow-2xl p-6 text-white">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">${country.flag} ${country.name} - ادارة الماستر</h2>
                            <button onclick="showMasterPanel()" class="bg-slate-600 px-4 py-2 rounded">رجوع</button>
                        </div>

                        <div class="bg-slate-700 p-4 rounded-xl mb-6">
                            <h3 class="font-bold mb-3">انشاء غرفة جديدة</h3>
                            <div class="grid md:grid-cols-4 gap-2">
                                <input id="roomName" placeholder="اسم الغرفة" class="p-2 rounded text-black">
                                <input id="roomColor" type="color" value="#8b5cf6" class="p-2 rounded h-10">
                                <input id="roomAdmin" placeholder="اسم المشرف" class="p-2 rounded text-black">
                                <button onclick="createRoom('${countryId}')" class="bg-green-600 p-2 rounded font-bold">انشاء</button>
                            </div>
                        </div>

                        <div id="adminRoomsList" class="grid md:grid-cols-3 gap-4"></div>
                    </div>
                `;
                loadRoomsAdmin(countryId);
            });
        }

        window.createRoom = async (countryId) => {
            const name = document.getElementById('roomName').value;
            const color = document.getElementById('roomColor').value;
            const admin = document.getElementById('roomAdmin').value;
            if(!name) return alert('اكتب اسم الغرفة');
            
            await push(ref(db, `countries/${countryId}/rooms`), {
                name: name,
                color: color,
                admin: admin || 'لا يوجد',
                createdAt: Date.now()
            });
            document.getElementById('roomName').value = '';
            document.getElementById('roomAdmin').value = '';
            loadRoomsAdmin(countryId);
        };

        function loadRooms(countryId) {
            onValue(ref(db, `countries/${countryId}/rooms`), snap => {
                const rooms = snap.val();
                let html = '';
                for(let id in rooms){
                    const r = rooms[id];
                    html += `
                        <div onclick="enterRoom('${countryId}', '${id}')" style="background:${r.color}" class="room-card p-6 rounded-xl cursor-pointer text-white">
                            <i class="fa-solid fa-comments text-3xl mb-2"></i>
                            <div class="font-bold">${r.name}</div>
                            <div class="text-xs opacity-80 mt-1">مشرف: ${r.admin}</div>
                        </div>
                    `;
                }
                document.getElementById('roomsList').innerHTML = html || '<p class="text-center col-span-4 text-slate-400">لا توجد غرف بعد</p>';
            });
        }

        function loadRoomsAdmin(countryId) {
            onValue(ref(db, `countries/${countryId}/rooms`), snap => {
                const rooms = snap.val();
                let html = '';
                for(let id in rooms){
                    const r = rooms[id];
                    html += `
                        <div style="background:${r.color}" class="p-4 rounded-xl text-white">
                            <div class="font-bold mb-2">${r.name}</div>
                            <div class="text-xs mb-3">مشرف: ${r.admin}</div>
                            <div class="flex gap-2">
                                <button onclick="editRoom('${countryId}','${id}')" class="flex-1 bg-white/20 p-2 rounded text-xs">تعديل</button>
                                <button onclick="deleteRoom('${countryId}','${id}')" class="bg-red-600 p-2 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('adminRoomsList').innerHTML = html;
            });
        }

        window.enterRoom = (countryId, roomId) => {
            currentRoom = { countryId, roomId };
            showChatRoom();
        };

        function showChatRoom() {
            get(ref(db, `countries/${currentRoom.countryId}/rooms/${currentRoom.roomId}`)).then(snap => {
                const room = snap.val();
                appDiv.innerHTML = `
                    <div class="bg-slate-800 rounded-2xl shadow-2xl text-white">
                        <div style="background:${room.color}" class="p-4 rounded-t-2xl">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="font-bold text-xl">${room.name}</h2>
                                    <div class="text-xs opacity-80">مشرف: ${room.admin}</div>
                                </div>
                                <button onclick="showRooms('${currentRoom.countryId}')" class="bg-white/20 px-4 py-2 rounded">خروج</button>
                            </div>
                        </div>
                        
                        <div id="messages" class="h-96 overflow-y-auto p-4 space-y-2 bg-slate-900"></div>
                        
                        <div class="p-4 border-t border-slate-700 flex gap-2">
                            <input id="msgInput" type="text" placeholder="اكتب رسالة..." class="flex-1 p-3 rounded-lg text-black">
                            <button onclick="sendRoomMsg()" class="bg-purple-600 px-6 rounded-lg font-bold">ارسال</button>
                        </div>
                    </div>
                `;
                loadRoomMessages();
            });
        }

        function loadRoomMessages() {
            onValue(ref(db, `countries/${currentRoom.countryId}/rooms/${currentRoom.roomId}/messages`), snap => {
                const msgs = snap.val();
                let html = '';
                for(let id in msgs){
                    const m = msgs[id];
                    html += `
                        <div class="bg-slate-800 p-3 rounded-lg flex justify-between items-start group">
                            <div>
                                <b class="text-purple-400">${m.user}:</b>
                                <span class="mr-2">${m.text}</span>
                            </div>
                            ${currentUser.role === 'master'? `<button onclick="deleteRoomMsg('${id}')" class="text-red-500 opacity-0 group-hover:opacity-100 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    `;
                }
                document.getElementById('messages').innerHTML = html;
                document.getElementById('messages').scrollTop = 999999;
            });
        }

        window.sendRoomMsg = () => {
            const input = document.getElementById('msgInput');
            if (input.value.trim()) {
                push(ref(db, `countries/${currentRoom.countryId}/rooms/${currentRoom.roomId}/messages`), {
                    user: currentUser.name,
                    text: input.value,
                    time: Date.now(),
                    uid: currentUser.uid
                });
                input.value = '';
            }
        };

        window.deleteRoomMsg = (msgId) => {
            remove(ref(db, `countries/${currentRoom.countryId}/rooms/${currentRoom.roomId}/messages/${msgId}`));
        };

        window.deleteCountry = (id) => {
            if(confirm('متأكد تحذف الدولة وكل غرفها؟')){
                remove(ref(db, `countries/${id}`));
            }
        };

        window.deleteRoom = (countryId, roomId) => {
            if(confirm('متأكد تحذف الغرفة؟')){
                remove(ref(db, `countries/${countryId}/rooms/${roomId}`));
            }
        };

        window.editRoom = (countryId, roomId) => {
            const newColor = prompt('اللون الجديد (hex):');
            const newAdmin = prompt('اسم المشرف الجديد:');
            if(newColor) update(ref(db, `countries/${countryId}/rooms/${roomId}`), {color: newColor});
            if(newAdmin) update(ref(db, `countries/${countryId}/rooms/${roomId}`), {admin: newAdmin});
        };

        function loadStats() {
            onValue(ref(db, 'countries'), snap => {
                const countries = snap.val();
                let totalRooms = 0;
                let totalCountries = 0;
                for(let cid in countries){
                    totalCountries++;
                    if(countries[cid].rooms) totalRooms += Object.keys(countries[cid].rooms).length;
                }
                document.getElementById('stats').innerHTML = `
                    <div>📍 عدد الدول: ${totalCountries}</div>
                    <div>💬 عدد الغرف: ${totalRooms}</div>
                `;
            });
        }
    </script>
</body>
</html>
