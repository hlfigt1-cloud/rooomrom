<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
<title>دردشة عربية | Arab Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap');
    * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; touch-action: pan-y; height: 100dvh; }
  .marquee { white-space: nowrap; overflow: hidden; }
  .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
    @keyframes marquee { 0% { transform: translate3d(-100%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
  .scroll-smooth { scroll-behavior: smooth; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .message-appear { animation: slideIn 0.2s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .ripple { position: relative; overflow: hidden; }
  .ripple:after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%; background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s; }
  .ripple:active:after { width: 300px; height: 300px; }
  .pinned-msg { border-right: 4px solid #eab308; }
  .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    :root { --room-grad: linear-gradient(135deg, #9333ea 0%, #ec4899 100%); }
</style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white h-[100dvh] overflow-hidden">
<!-- Login Modal -->
<div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl shadow-2xl w-full max-w-md border border-purple-500/30 overflow-hidden">
        <div class="bg-gradient-to-r from-purple-600 to-pink-600 p-6 text-center">
            <h2 class="text-3xl font-black mb-2">أهلاً بك في الدردشة</h2>
            <p class="text-purple-100 text-lg">اختر طريقة الدخول</p>
        </div>
        <div class="p-6 space-y-4">
            <button onclick="loginAsGuest()" class="ripple w-full bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold py-5 rounded-2xl transition-all shadow-lg active:scale-95">
                دخول كزائر 👤
            </button>
            <button onclick="showMemberLogin()" class="ripple w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white text-xl font-bold py-5 rounded-2xl transition-all shadow-lg active:scale-95">
                دخول كعضو ✨
            </button>
            <button onclick="showOwnerLogin()" class="ripple w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white text-xl font-bold py-5 rounded-2xl transition-all shadow-lg active:scale-95">
                دخول كمالك 👑
            </button>
        </div>
    </div>
</div>

<!-- Member Login Modal -->
<div id="memberModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl shadow-2xl w-full max-w-md border border-blue-500/30">
        <div class="bg-gradient-to-r from-blue-600 to-cyan-600 p-6 text-center rounded-t-3xl">
            <h2 class="text-3xl font-black">تسجيل عضو</h2>
        </div>
        <div class="p-6 space-y-4">
            <input id="memberName" type="text" placeholder="اسم المستخدم" class="w-full bg-slate-700 text-white text-xl px-6 py-4 rounded-2xl border-2 border-slate-600 focus:border-blue-500 outline-none" maxlength="20">
            <input id="memberPass" type="password" placeholder="كلمة المرور" class="w-full bg-slate-700 text-white text-xl px-6 py-4 rounded-2xl border-2 border-slate-600 focus:border-blue-500 outline-none">
            <div class="flex gap-3">
                <button onclick="loginMember()" class="ripple flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xl font-bold py-4 rounded-2xl active:scale-95">دخول</button>
                <button onclick="closeMemberModal()" class="ripple flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold py-4 rounded-2xl active:scale-95">إلغاء</button>
            </div>
        </div>
    </div>
</div>

<!-- Owner Login Modal -->
<div id="ownerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl shadow-2xl w-full max-w-md border border-amber-500/30">
        <div class="bg-gradient-to-r from-amber-600 to-orange-600 p-6 text-center rounded-t-3xl">
            <h2 class="text-3xl font-black">دخول المالك</h2>
        </div>
        <div class="p-6 space-y-4">
            <input id="ownerName" type="text" placeholder="اسم المالك" class="w-full bg-slate-700 text-white text-xl px-6 py-4 rounded-2xl border-2 border-slate-600 focus:border-amber-500 outline-none">
            <input id="ownerPass" type="password" placeholder="كلمة المرور" class="w-full bg-slate-700 text-white text-xl px-6 py-4 rounded-2xl border-2 border-slate-600 focus:border-amber-500 outline-none">
            <div class="flex gap-3">
                <button onclick="loginOwner()" class="ripple flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xl font-bold py-4 rounded-2xl active:scale-95">دخول</button>
                <button onclick="closeOwnerModal()" class="ripple flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold py-4 rounded-2xl active:scale-95">إلغاء</button>
            </div>
        </div>
    </div>
</div>

<!-- Main App -->
<div id="app" class="hidden h-[100dvh] flex flex-col">
<header class="bg-gradient-to-r from-purple-900 via-pink-900 to-purple-900 shadow-xl">
<div class="marquee bg-black/30 py-2"><div class="marquee-content text-yellow-300 text-lg font-bold" id="globalMarquee">🌟 مرحباً بكم في شات الدول العربية 🌟 دردشة ممتعة للجميع 🌟 احترم الآخرين 🌟 </div></div>
<div class="flex items-center justify-between px-4 py-3">
<button onclick="toggleSidebar()" class="ripple bg-white/10 hover:bg-white/20 p-3 rounded-2xl active:scale-95"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<div class="text-center flex-1"><h1 class="text-xl font-black"><span id="breadcrumb">الدول</span></h1><div class="flex items-center justify-center gap-3 text-sm"><p class="text-purple-200" id="onlineCount">متصل: 0</p><span class="text-purple-400">•</span><p class="text-purple-200" id="msgCount">الرسائل: 0</p></div>
