<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة عربية | Chat Arab</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { font-family: 'Cairo', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #1e293b; }
  ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-enter { animation: slideIn 0.2s ease-out; }
  
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 rgba(34, 197, 94, 0); }
  }
  .online-dot { animation: pulse-ring 2s infinite; }
  
  .gradient-text {
    background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .rank-owner { color: #fbbf24; }
  .rank-master { color: #f87171; }
  .rank-superadmin { color: #c084fc; }
  .rank-admin { color: #60a5fa; }
  .rank-member { color: #34d399; }
  .rank-guest { color: #94a3b8; }
  
  .modal-backdrop { backdrop-filter: blur(8px); }
</style>
</head>
<body class="bg-[#0f172a] text-slate-100 overflow-hidden h-screen">
<div id="app" class="h-screen flex flex-col">
  
  <!-- Login Screen -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="w-full max-w-md mx-4">
      <div class="bg-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-700/50 p-8">
        <div class="text-center mb-8">
          <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-sky-500 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-sky-500/30">
            <i class="fa-solid fa-comments text-3xl text-white"></i>
          </div>
          <h1 class="text-3xl font-bold gradient-text mb-2">دردشة عربية</h1>
          <p class="text-slate-400 text-sm">تواصل مع أصدقائك في جميع أنحاء الوطن العربي</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">الاسم المستعار</label>
            <input id="usernameInput" type="text" required minlength="3" maxlength="20"
              class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all"
              placeholder="أدخل اسمك">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">الدولة</label>
            <select id="countrySelect" required
              class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all">
              <option value="">اختر دولتك</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">كود الدخول <span class="text-slate-500 text-xs">(اختياري للمدير)</span></label>
            <input id="ownerCodeInput" type="password"
              class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all"
              placeholder="كود المشرف">
          </div>
          
          <button type="submit" id="loginBtn"
            class="w-full py-3 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-semibold rounded-xl shadow-lg shadow-sky-500/30 transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]">

            دخول الدردشة

        </form>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden h-screen flex flex-col">
    
    <!-- Welcome Bar -->
    <div id="welcomeBar" class="bg-gradient-to-l from-sky-600/20 to-indigo-600/20 border-b border-slate-700/50 px-4 py-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 text-sm">
          <i class="fa-solid fa-bullhorn text-sky-400"></i>
          <span id="welcomeMessage" class="text-slate-300">مرحباً بكم في الدردشة العربية</span>
        </div>
        <button id="editWelcomeBtn" class="hidden text-xs px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors">
          <i class="fa-solid fa-pen ml-1"></i>تعديل
        </button>
      </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-800/50 backdrop-blur-xl border-b border-slate-700/50 px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="toggleSidebar" class="lg:hidden p-2 hover:bg-slate-700 rounded-lg transition-colors">
            <i class="fa-solid fa-bars text-xl"></i>
          </button>
          <div class="w-10 h-10 bg-gradient-to-br from-sky-500 to-indigo-500 rounded-xl flex items-center justify-center shadow-lg shadow-sky-500/20">
            <i class="fa-solid fa-comments text-white"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold gradient-text">دردشة عربية</h1>
            <p id="currentRoomName" class="text-xs text-slate-400">الغرفة العامة</p>
          </div>
        </div>
        
        <div class="flex items-center gap-2">
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-700/50 rounded-lg">
            <div class="online-dot w-2 h-2 bg-green-500 rounded-full"></div>
            <span id="onlineCount" class="text-sm text-slate-300">0</span>
            <span class="text-sm text-slate-400">متصل</span>
          </div>
          
          <button id="logoutBtn" class="p-2 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors" title="تسجيل خروج">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- Sidebar -->
      <aside id="sidebar" class="fixed lg:relative inset-y-0 right-0 z-40 w-72 bg-slate-800/95 lg:bg-slate-800/50 backdrop-blur-xl border-l border-slate-700/50 transform translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        
        <!-- User Profile -->
        <div class="p-4 border-b border-slate-700/50">
          <div class="flex items-center gap-3">
            <div class="relative">
              <div id="userAvatar" class="w-12 h-12 bg-gradient-to-br from-sky-500 to-indigo-500 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-lg"></div>
              <div class="online-dot absolute -bottom-1 -left-1 w-4 h-4 bg-green-500 border-2 border-slate-800 rounded-full"></div>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <p id="userDisplayName" class="font-bold text-white truncate"></p>
                <i id="userFlag" class="text-lg"></i>
              </div>
              <div class="flex items-center gap-1.5">
                <i id="userRankIcon" class="fa-solid fa-star text-xs"></i>
                <p id="userRankText" class="text-xs text-slate-400"></p>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Rooms Section -->
        <div class="flex-1 overflow-y-auto p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">الغرف</h2>
            <button id="createRoomBtn" class="hidden p-1.5 hover:bg-slate-700 rounded-lg transition-colors text-sky-400" title="إنشاء غرفة">
              <i class="fa-solid fa-plus text-sm"></i>
            </button>
          </div>
          <div id="roomsList" class="space-y-1"></div>
          
          <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mt-6 mb-3">المتصلون</h2>
          <div id="onlineUsersList" class="space-y-1"></div>
        </div>
        
      </aside>
      
      <!-- Chat Area -->
      <main class="flex-1 flex flex-col bg-slate-900/30">
        
        <!-- Messages -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        
        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden px-4 py-2 text-sm text-slate-400">
          <i class="fa-solid fa-ellipsis fa-fade mr-2"></i>
          <span></span>
        </div>
        
        <!-- Message Input -->
        <div class="p-4 border-t border-slate-700/50 bg-slate-800/30 backdrop-blur-xl">
          <form id="messageForm" class="flex items-end gap-2">
            <div class="flex-1 bg-slate-700/50 rounded-xl border border-slate-600 focus-within:border-sky-500 transition-colors">
              <textarea id="messageInput" rows="1" maxlength="1000"
                class="w-full px-4 py-3 bg-transparent text-white placeholder-slate-500 resize-none focus:outline-none"
                placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <button type="submit" id="sendBtn"
              class="p-3 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white rounded-xl shadow-lg shadow-sky-500/30 transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>
        </div>
        
      </main>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="createRoomModal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop bg-black/50">
  <div class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md mx-4 p-6">
    <h3 class="text-xl font-bold mb-4">إنشاء غرفة جديدة</h3>
    <form id="createRoomForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">اسم الغرفة</label>
        <input id="roomNameInput" type="text" required maxlength="30"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-sky-500 focus:outline-none"
          placeholder="مثال: غرفة الأصدقاء">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">رسالة الترحيب</label>
        <input id="roomWelcomeInput" type="text" maxlength="100"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-sky-500 focus:outline-none"
          placeholder="مرحباً بكم في الغرفة">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">لون الغرفة</label>
        <div class="grid grid-cols-6 gap-2">
          <button type="button" class="room-color-btn w-full aspect-square rounded-lg bg-sky-500 ring-2 ring-white" data-color="#0ea5e9"></button>
          <button type="button" class="room-color-btn w-full aspect-square rounded-lg bg-purple-500" data-color="#a855f7"></button>
          <button type="button" class="room-color-btn w-full aspect-square rounded-lg bg-pink-500" data-color="#ec4899"></button>
          <button type="button" class="room-color-btn w-full aspect-square rounded-lg bg-green-500" data-color="#22c55e"></button>
          <button type="button" class="room-color-btn w-full aspect-square rounded-lg bg-yellow-500" data-color="#eab308"></button>
          <button type="button" class="room-color-btn w-full aspect-square rounded-lg bg-red-500" data-color="#ef4444"></button>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-semibold rounded-xl transition-all">إنشاء</button>
        <button type="button" id="cancelRoomBtn" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-all">إلغاء</button>
      </div>

  </div>
</div>

<div id="editWelcomeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop bg-black/50">
  <div class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md mx-4 p-6">
    <h3 class="text-xl font-bold mb-4">تعديل رسالة الترحيب</h3>
    <form id="editWelcomeForm" class="space-y-4">
      <div>
        <textarea id="welcomeTextInput" rows="3" maxlength="200"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white focus:ring-2 focus:ring-sky-500 focus:outline-none"
          placeholder="أدخل رسالة الترحيب العامة"></textarea>
      </div>
      <div class="flex gap-2">
        <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-semibold rounded-xl transition-all">حفظ</button>
        <button type="button" id="cancelWelcomeBtn" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-all">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
  }
}
</script>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from 'firebase/auth';
import { getDatabase, ref, set, push, onValue, onDisconnect, serverTimestamp, remove, get, update, query, orderByChild, limitToLast } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyAGpES78mV7-jgEQzi63R0TONGKfUQHFHc",
  authDomain: "hashed-cht.firebaseapp.com",
  databaseURL: "https://hashed-cht-default-rtdb.firebaseio.com",
  projectId: "hashed-cht",
  storageBucket: "hashed-cht.firebasestorage.app",
  messagingSenderId: "442699332645",
  appId: "1:442699332645:web:08d332758ac215a07453cc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// Constants
const OWNER_CODE = "19952005";
const COUNTRIES = {
  'Iraq': { name: 'العراق', flag: '🇮🇶' },
  'Saudi': { name: 'السعودية', flag: '🇸🇦' },
  'Egypt': { name: 'مصر', flag: '🇪🇬' },
  'UAE': { name: 'الإمارات', flag: '🇦🇪' },
  'Jordan': { name: 'الأردن', flag: '🇯🇴' },
  'Morocco': { name: 'المغرب', flag: '🇲🇦' },
  'Palestine': { name: 'فلسطين', flag: '🇵🇸' },
  'Lebanon': { name: 'لبنان', flag: '🇱🇧' },
  'Kuwait': { name: 'الكويت', flag: '🇰🇼' },
  'Qatar': { name: 'قطر', flag: '🇶🇦' },
  'Oman': { name: 'عمان', flag: '🇴🇲' },
  'Bahrain': { name: 'البحرين', flag: '🇧🇭' },
  'Syria': { name: 'سوريا', flag: '🇸🇾' },
  'Yemen': { name: 'اليمن', flag: '🇾🇪' },
  'Algeria': { name: 'الجزائر', flag: '🇩🇿' },
  'Tunisia': { name: 'تونس', flag: '🇹🇳' },
  'Libya': { name: 'ليبيا', flag: '🇱🇾' }
};

const RANKS = {
  owner: { name: 'مالك', icon: 'fa-crown', color: 'rank-owner', level: 5 },
  master: { name: 'ماستر', icon: 'fa-star', color: 'rank-master', level: 4 },
  superadmin: { name: 'سوبر أدمن', icon: 'fa-shield-halved', color: 'rank-superadmin', level: 3 },
  admin: { name: 'أدمن', icon: 'fa-shield', color: 'rank-admin', level: 2 },
  member: { name: 'عضو', icon: 'fa-user', color: 'rank-member', level: 1 },
  guest: { name: 'زائر', icon: 'fa-user', color: 'rank-guest', level: 0 }
};

// State
let currentUser = null;
let currentRoom = 'general';
let selectedRoomColor = '#0ea5e9';
let unsubscribeMessages = null;
let unsubscribeUsers = null;
let unsubscribeRooms = null;

// Populate countries
const countrySelect = document.getElementById('countrySelect');
Object.entries(COUNTRIES).forEach(([code, data]) => {
  const option = document.createElement('option');
  option.value = code;
  option.textContent = `${data.flag} ${data.name}`;
  countrySelect.appendChild(option);
});

// Auth State
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const userSnap = await get(ref(db, `users/${user.uid}`));
    if (userSnap.exists()) {
      currentUser = { uid: user.uid, ...userSnap.val() };
      showMainApp();
      initRealtimeListeners();
    }
  } else {
    currentUser = null;
    showLoginScreen();
  }
});

// Login Form
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-2"></i>جاري الدخول...';
  
  try {
    const username = document.getElementById('usernameInput').value.trim();
    const country = document.getElementById('countrySelect').value;
    const ownerCode = document.getElementById('ownerCodeInput').value;
    
    if (!username || !country) {
      alert('الرجاء ملء جميع الحقول المطلوبة');
      return;
    }
    
    const { user } = await signInAnonymously(auth);
    
    let rank = 'member';
    if (ownerCode === OWNER_CODE) {
      rank = 'owner';
    }
    
    const userData = {
      username,
      country,
      rank,
      online: true,
      lastSeen: serverTimestamp(),
      joinedAt: serverTimestamp()
    };
    
    await set(ref(db, `users/${user.uid}`), userData);
    
    // Set disconnect handler
    const userStatusRef = ref(db, `users/${user.uid}/online`);
    onDisconnect(userStatusRef).set(false);
    onDisconnect(ref(db, `users/${user.uid}/lastSeen`)).set(serverTimestamp());
    
    currentUser = { uid: user.uid, ...userData };
    
  } catch (error) {
    console.error('Login error:', error);
    alert('حدث خطأ أثناء تسجيل الدخول');
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket ml-2"></i>دخول الدردشة';
  }
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (confirm('هل تريد تسجيل الخروج؟')) {
    if (currentUser) {
      await set(ref(db, `users/${currentUser.uid}/online`), false);
      await set(ref(db, `users/${currentUser.uid}/lastSeen`), serverTimestamp());
    }
    await signOut(auth);
  }
});

// Show/Hide Screens
function showLoginScreen() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeUsers) unsubscribeUsers();
  if (unsubscribeRooms) unsubscribeRooms();
}

function showMainApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  updateUserProfile();
  initDefaultRoom();
}

// Update User Profile
function updateUserProfile() {
  if (!currentUser) return;
  
  document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
  document.getElementById('userDisplayName').textContent = currentUser.username;
  document.getElementById('userFlag').textContent = COUNTRIES[currentUser.country]?.flag || '';
  
  const rankInfo = RANKS[currentUser.rank] || RANKS.guest;
  document.getElementById('userRankIcon').className = `fa-solid ${rankInfo.icon} text-xs ${rankInfo.color}`;
  document.getElementById('userRankText').textContent = rankInfo.name;
  document.getElementById('userRankText').className = `text-xs ${rankInfo.color}`;
  
  // Show owner controls
  if (currentUser.rank === 'owner' || currentUser.rank === 'master') {
    document.getElementById('createRoomBtn').classList.remove('hidden');
    document.getElementById('editWelcomeBtn').classList.remove('hidden');
  }
}

// Initialize Default Room
async function initDefaultRoom() {
  const generalRoomRef = ref(db, 'rooms/general');
  const snap = await get(generalRoomRef);
  if (!snap.exists()) {
    await set(generalRoomRef, {
      name: 'الغرفة العامة',
      welcome: 'مرحباً بكم في الغرفة العامة',
      color: '#0ea5e9',
      createdBy: 'system',
      createdAt: serverTimestamp()
    });
  }
  
  const settingsRef = ref(db, 'settings/welcomeMessage');
  const settingsSnap = await get(settingsRef);
  if (!settingsSnap.exists()) {
    await set(settingsRef, 'مرحباً بكم في الدردشة العربية');
  }
}

// Realtime Listeners
function initRealtimeListeners() {
  // Welcome message
  onValue(ref(db, 'settings/welcomeMessage'), (snap) => {
    document.getElementById('welcomeMessage').textContent = snap.val() || 'مرحباً بكم';
  });
  
  // Rooms
  unsubscribeRooms = onValue(ref(db, 'rooms'), (snap) => {
    const rooms = snap.val() || {};
    renderRooms(rooms);
  });
  
  // Online Users
  unsubscribeUsers = onValue(ref(db, 'users'), (snap) => {
    const users = snap.val() || {};
    const onlineUsers = Object.entries(users).filter(([uid, u]) => u.online);
    document.getElementById('onlineCount').textContent = onlineUsers.length;
    renderOnlineUsers(onlineUsers);
  });
  
  // Messages for current room
  loadMessages(currentRoom);
}

// Load Messages
function loadMessages(roomId) {
  if (unsubscribeMessages) unsubscribeMessages();
  
  const messagesRef = query(ref(db, `messages/${roomId}`), orderByChild('timestamp'), limitToLast(100));
  unsubscribeMessages = onValue(messagesRef, (snap) => {
    const messages = [];
    snap.forEach((child) => {
      messages.push({ id: child.key, ...child.val() });
    });
    renderMessages(messages);
  });
}

// Render Rooms
function renderRooms(rooms) {
  const container = document.getElementById('roomsList');
  container.innerHTML = '';
  
  Object.entries(rooms).forEach(([id, room]) => {
    const isActive = id === currentRoom;
    const div = document.createElement('div');
    div.className = `flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${isActive ? 'bg-slate-700/70' : 'hover:bg-slate-700/50'}`;
    div.innerHTML = `
      <div class="flex items-center gap-3 flex-1 min-w-0">
        <div class="w-2 h-2 rounded-full" style="background-color: ${room.color}"></div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">${room.name}</p>
          <p class="text-xs text-slate-400 truncate">${room.welcome || ''}</p>
        </div>
      ${(currentUser?.rank === 'owner' && id !== 'general') ? `
        <button class="delete-room-btn p-1.5 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors" data-room="${id}">
          <i class="fa-solid fa-trash text-xs"></i>
        </button>
      ` : ''}
    `;
    
    div.addEventListener('click', (e) => {
      if (!e.target.closest('.delete-room-btn')) {
        switchRoom(id, room);
      }
    });
    
    const deleteBtn = div.querySelector('.delete-room-btn');
    if (deleteBtn) {
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteRoom(id);
      });
    }
    
    container.appendChild(div);
  });
  
  // Update current room name
  const room = rooms[currentRoom];
  if (room) {
    document.getElementById('currentRoomName').textContent = room.name;
    document.getElementById('currentRoomName').style.color = room.color;
  }
}

// Switch Room
function switchRoom(roomId, room) {
  currentRoom = roomId;
  document.getElementById('currentRoomName').textContent = room.name;
  document.getElementById('currentRoomName').style.color = room.color;
  loadMessages(roomId);
  renderRooms({}); // Trigger re-render to update active state
  get(ref(db, 'rooms')).then(snap => renderRooms(snap.val() || {}));
}

// Delete Room
async function deleteRoom(roomId) {
  if (roomId === 'general') {
    alert('لا يمكن حذف الغرفة العامة');
    return;
  }
  if (confirm('هل تريد حذف هذه الغرفة وجميع رسائلها؟')) {
    await remove(ref(db, `rooms/${roomId}`));
    await remove(ref(db, `messages/${roomId}`));
    if (currentRoom === roomId) {
      switchRoom('general', { name: 'الغرفة العامة', color: '#0ea5e9' });
    }
  }
}

// Render Online Users
function renderOnlineUsers(users) {
  const container = document.getElementById('onlineUsersList');
  container.innerHTML = '';
  
  users.sort((a, b) => {
    const rankA = RANKS[a[1].rank]?.level || 0;
    const rankB = RANKS[b[1].rank]?.level || 0;
    return rankB - rankA;
  });
  
  users.forEach(([uid, user]) => {
    const rankInfo = RANKS[user.rank] || RANKS.guest;
    const div = document.createElement('div');
    div.className = 'flex items-center gap-2 p-2 rounded-lg hover:bg-slate-700/50 transition-colors';
    div.innerHTML = `
      <div class="relative">
        <div class="w-8 h-8 bg-gradient-to-br from-sky-500 to-indigo-500 rounded-lg flex items-center justify-center text-white text-sm font-bold">
          ${user.username.charAt(0).toUpperCase()}
        </div>
        <div class="online-dot absolute -bottom-0.5 -left-0.5 w-3 h-3 bg-green-500 border-2 border-slate-800 rounded-full"></div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1">
          <p class="text-sm font-medium truncate">${user.username}</p>
          <span class="text-xs">${COUNTRIES[user.country]?.flag || ''}</span>
        </div>
        <div class="flex items-center gap-1">
          <i class="fa-solid ${rankInfo.icon} text-xs ${rankInfo.color}"></i>
          <p class="text-xs ${rankInfo.color}">${rankInfo.name}</p>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

// Render Messages
function renderMessages(messages) {
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';
  
  if (messages.length === 0) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-slate-500">
        <i class="fa-regular fa-comments text-5xl mb-4"></i>
        <p class="text-sm">لا توجد رسائل بعد. كن أول من يرسل!</p>
      </div>
    `;
    return;
  }
  
  messages.forEach((msg) => {
    const isOwn = msg.senderId === currentUser?.uid;
    const rankInfo = RANKS[msg.senderRank] || RANKS.guest;
    const time = new Date(msg.timestamp).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
    
    const div = document.createElement('div');
    div.className = `msg-enter flex gap-3 ${isOwn ? 'flex-row-reverse' : ''}`;
    div.innerHTML = `
      <div class="flex-shrink-0">
        <div class="w-10 h-10 bg-gradient-to-br from-sky-500 to-indigo-500 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">
          ${msg.senderName.charAt(0).toUpperCase()}
        </div>
      </div>
      <div class="flex-1 max-w-[75%] ${isOwn ? 'items-end' : 'items-start'} flex flex-col">
        <div class="flex items-center gap-2 mb-1 ${isOwn ? 'flex-row-reverse' : ''}">
          <span class="font-semibold text-sm ${rankInfo.color}">${msg.senderName}</span>
          <span class="text-xs">${COUNTRIES[msg.senderCountry]?.flag || ''}</span>
          <i class="fa-solid ${rankInfo.icon} text-xs ${rankInfo.color}"></i>
          <span class="text-xs text-slate-500">${time}</span>
        </div>
        <div class="bg-slate-800/70 backdrop-blur-sm px-4 py-2.5 rounded-2xl ${isOwn ? 'rounded-tl-sm' : 'rounded-tr-sm'}">
          <p class="text-sm leading-relaxed break-words">${escapeHtml(msg.text)}</p>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
  
  container.scrollTop = container.scrollHeight;
}

// Send Message
document.getElementById('messageForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  
  if (!text || !currentUser) return;
  
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  
  try {
    await push(ref(db, `messages/${currentRoom}`), {
      text,
      senderId: currentUser.uid,
      senderName: currentUser.username,
      senderRank: currentUser.rank,
      senderCountry: currentUser.country,
      timestamp: serverTimestamp()
    });
    input.value = '';
    input.style.height = 'auto';
  } catch (error) {
    console.error('Send error:', error);
    alert('فشل إرسال الرسالة');
  } finally {
    sendBtn.disabled = false;
  }
});

// Auto-resize textarea
document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Create Room Modal
document.getElementById('createRoomBtn').addEventListener('click', () => {
  document.getElementById('createRoomModal').classList.remove('hidden');
});

document.getElementById('cancelRoomBtn').addEventListener('click', () => {
  document.getElementById('createRoomModal').classList.add('hidden');
  document.getElementById('createRoomForm').reset();
});

document.querySelectorAll('.room-color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.room-color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white'));
    btn.classList.add('ring-2', 'ring-white');
    selectedRoomColor = btn.dataset.color;
  });
});

document.getElementById('createRoomForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('roomNameInput').value.trim();
  const welcome = document.getElementById('roomWelcomeInput').value.trim();
  
  if (!name) return;
  
  const roomId = name.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
  
  try {
    await set(ref(db, `rooms/${roomId}`), {
      name,
      welcome: welcome || `مرحباً بكم في ${name}`,
      color: selectedRoomColor,
      createdBy: currentUser.uid,
      createdAt: serverTimestamp()
    });
    
    document.getElementById('createRoomModal').classList.add('hidden');
    document.getElementById('createRoomForm').reset();
  } catch (error) {
    console.error('Create room error:', error);
    alert('فشل إنشاء الغرفة');
  }
});

// Edit Welcome Modal
document.getElementById('editWelcomeBtn').addEventListener('click', async () => {
  const snap = await get(ref(db, 'settings/welcomeMessage'));
  document.getElementById('welcomeTextInput').value = snap.val() || '';
  document.getElementById('editWelcomeModal').classList.remove('hidden');
});

document.getElementById('cancelWelcomeBtn').addEventListener('click', () => {
  document.getElementById('editWelcomeModal').classList.add('hidden');
});

document.getElementById('editWelcomeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('welcomeTextInput').value.trim();
  
  try {
    await set(ref(db, 'settings/welcomeMessage'), text || 'مرحباً بكم في الدردشة العربية');
    document.getElementById('editWelcomeModal').classList.add('hidden');
  } catch (error) {
    console.error('Update welcome error:', error);
    alert('فشل تحديث الرسالة');
  }
});

// Toggle Sidebar Mobile
document.getElementById('toggleSidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('translate-x-full');
});

// Close sidebar on click outside mobile
document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebar');
  if (window.innerWidth < 1024 && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
    sidebar.classList.add('translate-x-full');
  }
});

// Utility
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Close modals on backdrop click
document.querySelectorAll('.modal-backdrop').forEach(modal => {
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.add('hidden');
    }
  });
});
</script>
