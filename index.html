<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomRom - Master System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
      .room-card { transition: all 0.3s; }
      .room-card:hover { transform: translateY(-2px) scale(1.02); }
      .marquee {
            white-space: nowrap;
            overflow: hidden;
        }
      .marquee span {
            display: inline-block;
            padding-right: 100%;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
      .gold-crown {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px gold);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-700 min-h-screen p-4">
    <div id="marqueeBar" class="hidden"></div>
    <div id="app" class="w-full max-w-6xl mx-auto"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, push, onValue, remove, set, update, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const MASTER_CODE = "19952005";

        const firebaseConfig = {
          apiKey: "AIzaSyAGpES78mV7-jgEQzi63R0TONGKfUQHFHc",
          authDomain: "hashed-cht.firebaseapp.com",
          databaseURL: "https://hashed-cht-default-rtdb.firebaseio.com",
          projectId: "hashed-cht",
          storageBucket: "hashed-cht.firebasestorage.app",
          messagingSenderId: "442699332645",
          appId: "1:442699332645:web:08d332758ac215a07453cc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const appDiv = document.getElementById('app');

        let currentUser = { role: 'guest', name: 'ضيف', protected: false };
        let currentCountry = null;
        let currentRoom = null;

        signInAnonymously(auth);

        // تحميل الشريط الترحيبي
        onValue(ref(db, 'settings/marquee'), snap => {
            const text = snap.val();
            const bar = document.getElementById('marqueeBar');
            if(text){
                bar.className = 'bg-gradient-to-r from-yellow-500 to-orange-500 text-black py-2 mb-4 rounded-lg marquee';
                bar.innerHTML = `<span class="font-bold">📢 ${text}</span>`;
            } else {
                bar.className = 'hidden';
            }
        });

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser.uid = user.uid;
                checkProtectedUser();
                showMainMenu();
            }
        });

        async function checkProtectedUser() {
            const snap = await get(ref(db, `protectedUsers/${currentUser.uid}`));
            if(snap.exists()){
                currentUser.protected = true;
                currentUser.role = snap.val().role || 'admin';
                currentUser.name = snap.val().name;
            }
        }

        function showMainMenu() {
            appDiv.innerHTML = `
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 text-white">
                    <div class="text-center mb-8">
                        <h1 class="text-4xl font-bold mb-2 text-purple-400">RoomRom System</h1>
                        <p class="text-slate-300">نظام دول وغرف متكامل</p>
                        <div class="mt-4 text-sm flex justify-center gap-2 items-center">
                            ${currentUser.role === 'master'? 
                                `<button onclick="showMasterPanel()" class="bg-gradient-to-r from-yellow-500 to-orange-500 text-black px-4 py-1 rounded-full font-bold hover:scale-105 transition">
                                    <i class="fa-solid fa-crown gold-crown"></i> محمي
                                </button>` : 
                                currentUser.role === 'admin'? 
                                `<span class="bg-blue-500 px-4 py-1 rounded-full"><i class="fa-solid fa-shield"></i> ${currentUser.name}</span>` :
                                `<span class="bg-slate-600 px-4 py-1 rounded-full">${currentUser.name}</span>`
                            }
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 mb-6">
                        <button onclick="enterAsMember()" class="bg-purple-600 hover:bg-purple-700 p-6 rounded-xl font-bold text-lg transition">
                            <i class="fa-solid fa-users text-3xl mb-2"></i><br>دخول كعضو
                        </button>
                        <button onclick="showMasterLogin()" class="bg-yellow-600 hover:bg-yellow-700 text-black p-6 rounded-xl font-bold text-lg transition">
                            <i class="fa-solid fa-crown text-3xl mb-2"></i><br>دخول الماستر
                        </button>
                    </div>

                    <h3 class="font-bold mb-4 text-xl text-center">🌍 اختر الدولة</h3>
                    <div id="countriesList" class="grid md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                </div>
            `;
            loadCountries();
        }

        window.showMasterLogin = () => {
            appDiv.innerHTML = `
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 max-w-md mx-auto text-white">
                    <button onclick="showMainMenu()" class="mb-4 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
                    <h2 class="text-2xl font-bold mb-6 text-center text-yellow-400">دخول الماستر</h2>
                    <input id="masterCode" type="password" placeholder="ادخل رمز الماستر" class="w-full p-3 mb-4 rounded-lg text-black text-center text-xl">
                    <button onclick="checkMaster()" class="w-full bg-yellow-600 text-black p-3 rounded-lg font-bold">دخول</button>
                    <p id="masterError" class="text-red-400 text-sm mt-3 text-center"></p>
                </div>
            `;
        };

        window.checkMaster = () => {
            const code = document.getElementById('masterCode').value;
            if(code === MASTER_CODE){
                currentUser = { uid: auth.currentUser.uid, role: 'master', name: 'محمي', protected: true };
                showMasterPanel();
            } else {
                document.getElementById('masterError').textContent = 'الرمز غلط';
            }
        };

        window.enterAsMember = () => {
            const name = prompt('اكتب اسمك:');
            if(name) {
                currentUser = { uid: auth.currentUser.uid, role: 'member', name: name, protected: false };
                showMainMenu();
            }
        };

        function showMasterPanel() {
            appDiv.innerHTML = `
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-6 text-white">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-yellow-400"><i class="fa-solid fa-crown gold-crown"></i> لوحة تحكم المالك - محمي</h2>
                        <button onclick="showMainMenu()" class="bg-slate-600 px-4 py-2 rounded hover:bg-slate-500"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
                    </div>

                    <div class="grid md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-slate-700 p-4 rounded-xl">
                            <h3 class="font-bold mb-3"><i class="fa-solid fa-earth-asia"></i> انشاء دولة</h3>
                            <input id="countryName" placeholder="اسم الدولة" class="w-full p-2 mb-2 rounded text-black">
                            <input id="countryFlag" placeholder="العلم 🇮🇶" class="w-full p-2 mb-2 rounded text-black">
                            <button onclick="createCountry()" class="w-full bg-green-600 p-2 rounded font-bold">انشاء</button>
                        </div>
                        
                        <div class="bg-slate-700 p-4 rounded-xl">
                            <h3 class="font-bold mb-3"><i class="fa-solid fa-bullhorn"></i> الشريط الترحيبي</h3>
                            <input id="marqueeText" placeholder="نص متحرك" class="w-full p-2 mb-2 rounded text-black">
                            <button onclick="updateMarquee()" class="w-full bg-blue-600 p-2 rounded font-bold">تحديث</button>
                            <button onclick="removeMarquee()" class="w-full bg-red-600 p-2 rounded font-bold mt-1">حذف</button>
                        </div>

                        <div class="bg-slate-700 p-4 rounded-xl">
                            <h3 class="font-bold mb-3"><i class="fa-solid fa-user-shield"></i> اضافة محمي</h3>
                            <input id="protectedName" placeholder="اسم المحمي" class="w-full p-2 mb-2 rounded text-black">
                            <select id="protectedRole" class="w-full p-2 mb-2 rounded text-black">
                                <option value="admin">مشرف</option>
                                <option value="master">ماستر</option>
                            </select>
                            <button onclick="addProtected()" class="w-full bg-purple-600 p-2 rounded font-bold">اضافة صلاحية</button>
                        </div>
                    </div>

                    <h3 class="font-bold mb-3 text-xl">الدول الحالية:</h3>
                    <div id="adminCountriesList" class="grid md:grid-cols-3 gap-4"></div>
                </div>
            `;
            loadCountriesAdmin();
        }

        window.createCountry = async () => {
            const name = document.getElementById('countryName').value;
            const flag = document.getElementById('countryFlag').value;
            if(!name) return alert('اكتب اسم الدولة');
            
            await push(ref(db, 'countries'), {
                name: name,
                flag: flag || '🌍',
                createdAt: Date.now()
            });
            document.getElementById('countryName').value = '';
            document.getElementById('countryFlag').value = '';
            loadCountriesAdmin();
        };

        window.updateMarquee = () => {
            const text = document.getElementById('marqueeText').value;
            set(ref(db, 'settings/marquee'), text);
            alert('تم تحديث الشريط');
        };

        window.removeMarquee = () => {
            remove(ref(db, 'settings/marquee'));
            alert('تم حذف الشريط');
        };

        window.addProtected = async () => {
            const name = document.getElementById('protectedName').value;
            const role = document.getElementById('protectedRole').value;
            if(!name) return alert('اكتب الاسم');
            
            const newUserRef = push(ref(db, 'protectedUsers'));
            await set(newUserRef, { name: name, role: role, addedAt: Date.now() });
            alert(`تم اضافة ${name} كـ ${role}`);
            document.getElementById('protectedName').value = '';
        };

        function loadCountries() {
            onValue(ref(db, 'countries'), snap => {
                const countries = snap.val();
                let html = '';
                for(let id in countries){
                    const c = countries[id];
                    html += `
                        <div onclick="openCountry('${id}')" class="room-card bg-gradient-to-br from-slate-700 to-slate-600 p-6 rounded-xl cursor-pointer hover:from-slate-600 hover:to-slate-500 border border-slate-600">
                            <div class="text-6xl mb-3 text-center">${c.flag}</div>
                            <div class="font-bold text-lg text-center">${c.name}</div>
                            <div class="text-xs text-slate-400 mt-2 text-center">اضغط للدخول</div>
                        </div>
                    `;
                }
                document.getElementById('countriesList').innerHTML = html || '<p class="text-center col-span-4 text-slate-400">لا توجد دول بعد</p>';
            });
        }

        function loadCountriesAdmin() {
            onValue(ref(db, 'countries'), snap => {
                const countries = snap.val();
                let html = '';
                for(let id in countries){
                    const c = countries[id];
                    html += `
                        <div class="bg-slate-700 p-4 rounded-xl border border-slate-600">
                            <div class="text-4xl mb-2 text-center">${c.flag}</div>
                            <div class="font-bold mb-3 text-center">${c.name}</div>
                            <div class="flex gap-2">
