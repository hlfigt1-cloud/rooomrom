<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomRom - النظام الذهبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --gold: #fbbf24;
            --gold-dark: #d97706;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --owner: #dc2626;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: var(--text); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .golden-crown { position: fixed; top: 20px; left: 20px; z-index: 1000; animation: float 3s ease-in-out infinite; }
        .golden-crown i { font-size: 40px; color: var(--gold); filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .ticker { background: linear-gradient(90deg, var(--gold-dark), var(--gold)); color: #000; padding: 10px 0; font-weight: 700; margin-bottom: 20px; border-radius: 8px; overflow: hidden; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: scroll 30s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; background: linear-gradient(90deg, var(--primary), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .header p { color: var(--text-muted); font-size: 1.1rem; }
        .login-section { background: var(--card-bg); border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .tab-btn { padding: 18px; background: #334155; border: none; border-radius: 12px; color: var(--text); font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .tab-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .tab-btn.active { background: var(--primary); box-shadow: 0 0 20px rgba(124, 58, 237, 0.5); }
        .tab-btn.gold { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #000; }
        .tab-btn.owner { background: linear-gradient(135deg, #dc2626, #f87171); color: #fff; }
        .countries-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 25px; }
        .country-card { background: #334155; border-radius: 12px; padding: 20px 15px; text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .country-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4); }
        .country-card .flag { font-size: 3rem; margin-bottom: 10px; }
        .country-card .name { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
        .country-card .users { color: var(--text-muted); font-size: 0.9rem; }
        .admin-panel { display: none; background: var(--card-bg); border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid var(--border); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .admin-header h2 { font-size: 1.8rem; color: var(--gold); }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.3s; }
        .logout-btn:hover { background: #dc2626; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .admin-card { background: #334155; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .admin-card h3 { color: var(--gold); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .admin-btn { width: 100%; padding: 12px; margin-top: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.3s; font-size: 1rem; }
        .admin-btn:hover { background: #6d28d9; transform: translateY(-2px); }
        .admin-btn.danger { background: var(--danger); }
        .admin-btn.danger:hover { background: #dc2626; }
        .admin-btn.success { background: var(--success); }
        .admin-btn.success:hover { background: #059669; }
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Tajawal', sans-serif; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2); }
        .room-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .room-item { background: #0f172a; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .room-item .delete-btn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .owner-badge { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; display: inline-block; }
    </style>
</head>
<body>
    <div class="golden-crown">
        <i class="fas fa-crown"></i>
    </div>

    <div class="container">
        <div class="ticker">
            <div class="ticker-content">
                👑 مرحباً بكم في RoomRom - النظام الذهبي للدردشة العربية 👑 انضم الآن وكن جزءاً من مجتمعنا المميز 👑
            </div>
        </div>

        <div class="header">
            <h1>RoomRom System</h1>
            <p>النظام الذهبي للدردشة العربية</p>
        </div>

        <div id="loginSection" class="login-section">
            <div class="login-tabs">
                <button class="tab-btn gold" onclick="showLogin('admin')">
                    <i class="fas fa-crown"></i> دخول المدير
                </button>
                <button class="tab-btn owner" onclick="showLogin('owner')">
                    <i class="fas fa-shield-halved"></i> دخول المالك
                </button>
                <button class="tab-btn" onclick="guestLogin()">
                    <i class="fas fa-user"></i> دخول كزائر
                </button>
            </div>

            <div id="loginBox" class="hidden">
                <h3 id="loginTitle" style="margin-bottom: 15px; text-align: center;"></h3>
                <input type="password" id="loginPass" placeholder="ادخل كلمة السر">
                <button class="admin-btn" onclick="checkLogin()">دخول</button>
                <button class="admin-btn danger" onclick="hideLogin()" style="margin-top:5px">الغاء</button>
            </div>

            <div class="countries-grid" id="countriesGrid"></div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div class="admin-header">
                <h2><i class="fas fa-crown"></i> لوحة التحكم <span class="owner-badge" id="roleBadge">ADMIN</span></h2>
                <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
            </div>

            <div class="admin-grid">
                <div class="admin-card">
                    <h3><i class="fas fa-door-open"></i> إدارة الغرف</h3>
                    <select id="countrySelect"></select>
                    <input type="text" id="roomName" placeholder="اسم الغرفة الجديدة">
                    <button class="admin-btn" onclick="addRoom()">إضافة غرفة</button>
                    <button class="admin-btn danger" onclick="clearAllRooms()">حذف كل الغرف</button>
                    <div class="room-list" id="roomList"></div>
                </div>

                <div class="admin-card">
                    <h3><i class="fas fa-users"></i> إدارة الأعضاء</h3>
                    <input type="text" id="banUserName" placeholder="اسم العضو للحظر">
                    <button class="admin-btn danger" onclick="banUser()">حظر عضو</button>
                    <button class="admin-btn success" onclick="unbanUser()">فك حظر عضو</button>
                    <button class="admin-btn" onclick="kickAll()">طرد كل الأعضاء من غرفة</button>
                </div>

                <div class="admin-card">
                    <h3><i class="fas fa-bullhorn"></i> الرسائل الجماعية</h3>
                    <textarea id="broadcastMsg" rows="4" placeholder="اكتب الرسالة التي تريد ارسالها للجميع..."></textarea>
                    <button class="admin-btn" onclick="sendBroadcast()">ارسال للجميع</button>
                    <button class="admin-btn" onclick="sendToCountry()">ارسال لدولة محددة</button>
                </div>

                <div class="admin-card">
                    <h3><i class="fas fa-chart-line"></i> الإحصائيات</h3>
                    <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin: 10px 0;">
                        <p>إجمالي الدول: <strong id="totalCountries">0</strong></p>
                        <p>إجمالي الغرف: <strong id="totalRooms">0</strong></p>
                        <p>المستخدمين المتصلين: <strong id="onlineUsers">0</strong></p>
                    </div>
                    <button class="admin-btn" onclick="refreshStats()">تحديث الإحصائيات</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const OWNER_PASSWORD = 'owner2024';
        let currentRole = '';

        let countries = JSON.parse(localStorage.getItem('countries')) || [
            { name: 'السعودية', flag: '🇸🇦', users: 12450, rooms: ['الرياض', 'جدة', 'الدمام'] },
            { name: 'العراق', flag: '🇮🇶', users: 8920, rooms: ['بغداد', 'البصرة', 'اربيل'] },
            { name: 'مصر', flag: '🇪🇬', users: 15300, rooms: ['القاهرة', 'الاسكندرية', 'الجيزة'] },
            { name: 'الإمارات', flag: '🇦🇪', users: 6780, rooms: ['دبي', 'ابوظبي', 'الشارقة'] },
            { name: 'الكويت', flag: '🇰🇼', users: 4320, rooms: ['الكويت', 'الجهراء'] },
            { name: 'قطر', flag: '🇶🇦', users: 3210, rooms: ['الدوحة', 'الريان'] },
            { name: 'البحرين', flag: '🇧🇭', users: 2100, rooms: ['المنامة', 'المحرق'] },
            { name: 'عمان', flag: '🇴🇲', users: 3450, rooms: ['مسقط', 'صلالة'] }
        ];

        function saveData() {
            localStorage.setItem('countries', JSON.stringify(countries));
            renderCountries();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCountries').textContent = countries.length;
            document.getElementById('totalRooms').textContent = countries.reduce((sum, c) => sum + c.rooms.length, 0);
            document.getElementById('onlineUsers').textContent = countries.reduce((sum, c) => sum + c.users, 0);
        }

        function showLogin(role) {
            currentRole = role;
            document.getElementById('loginTitle').textContent = role === 'admin' ? 'دخول المدير' : 'دخول المالك';
            document.getElementById('loginBox').classList.remove('hidden');
        }

        function hideLogin() {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('loginPass').value = '';
        }

        function checkLogin() {
            const pass = document.getElementById('loginPass').value;
            const correctPass = currentRole === 'admin' ? ADMIN_PASSWORD : OWNER_PASSWORD;
            
            if (pass === correctPass) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('roleBadge').textContent = currentRole.toUpperCase();
                localStorage.setItem('role', currentRole);
                loadCountrySelect();
                showRooms();
                updateStats();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function guestLogin() {
            alert('مرحباً بك كزائر! يمكنك تصفح الغرف ولكن لا يمكنك الإرسال.');
            localStorage.setItem('role', 'guest');
        }

        function logout() {
            localStorage.removeItem('role');
            location.reload();
        }

        function renderCountries() {
            const grid = document.getElementById('countriesGrid');
            grid.innerHTML = countries.map(c => `
                <div class="country-card" onclick="selectCountry('${c.name}')">
                    <div class="flag">${c.flag}</div>
                    <div class="name">${c.name}</div>
                    <div class="users">${c.users.toLocaleString()} عضو</div>
                </div>
            `).join('');
        }

        function loadCountrySelect() {
            const select = document.getElementById('countrySelect');
            select.innerHTML = countries.map(c => `<option value="${c.name}">${c.flag} ${c.name}</option>`).join('');
        }

        function addRoom() {
            const countryName = document.getElementById('countrySelect').value;
            const roomName = document.getElementById('roomName').value.trim();
            
            if (!roomName) {
                alert('الرجاء ادخال اسم الغرفة');
                return;
            }
            
            const country = countries.find(c => c.name === countryName);
            if (country.rooms.includes(roomName)) {
                alert('الغرفة موجودة مسبقاً');
                return;
            }
            
            country.rooms.push(roomName);
            document.getElementById('roomName').value = '';
            saveData();
            showRooms();
            alert('تم اضافة الغرفة بنجاح!');
        }

        function showRooms() {
            const countryName = document.getElementById('countrySelect').value;
            const country = countries.find(c => c.name === countryName);
            const list = document.getElementById('roomList');
            
            list.innerHTML = country.rooms.map(r => `
                <div class="room-item">
                    <span><i class="fas fa-door-open"></i> ${r}</span>
                    <button class="delete-btn" onclick="deleteRoom('${countryName}', '${r}')">حذف</button>
                </div>
            `).join('') || '<p style="color:var(--text-muted);text-align:center">لا توجد غرف</p>';
        }

        function deleteRoom(countryName, roomName) {
            if(confirm('هل انت متأكد من حذف الغرفة؟')) {
                const country = countries.find(c => c.name === countryName);
                country.rooms = country.rooms.filter(r => r !== roomName);
                saveData();
                showRooms();
            }
        }

        function clearAllRooms() {
            if(confirm('هل انت متأكد من حذف كل الغرف؟ لا يمكن التراجع!')) {
                countries.forEach(c => c.rooms = []);
                saveData();
                showRooms();
                alert('تم حذف جميع الغرف');
            }
        }

        function banUser() {
            const name = document.getElementById('banUserName').value.trim();
            if (!name) {
                alert('الرجاء ادخال اسم العضو');
                return;
            }
            alert(`تم حظر العضو: ${name}`);
            document.getElementById('banUserName').value = '';
        }

        function unbanUser() {
            const name = document.getElementById('banUserName').value.trim();
            if (!name) {
                alert('الرجاء ادخال اسم العضو');
                return;
            }
            alert(`تم فك حظر العضو: ${name}`);
            document.getElementById('banUserName').value = '';
        }

        function kickAll() {
            const countryName = document.getElementById('countrySelect').value;
            if(confirm(`طرد كل الأعضاء من ${countryName}؟`)) {
                alert('تم طرد جميع الأعضاء');
            }
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (!msg) {
                alert('الرجاء كتابة رسالة');
                return;
            }
            alert('تم ارسال الرسالة للجميع بنجاح!');
            document.getElementById('broadcastMsg').value = '';
        }

        function sendToCountry() {
            const countryName = document.getElementById('countrySelect').value;
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (!msg) {
                alert('الرجاء كتابة رسالة');
                return;
            }
            alert(`تم ارسال الرسالة إلى ${countryName} بنجاح!`);
            document.getElementById('broadcastMsg').value = '';
        }

        function refreshStats() {
            updateStats();
            alert('تم تحديث الإحصائيات');
        }

        function selectCountry(name) {
            alert(`اخترت دولة: ${name}\nيمكنك الانضمام للدردشة من التطبيق`);
        }

        // تحميل البيانات عند البداية
        renderCountries();
        updateStats();

        // تحقق من الجلسة
        const savedRole = localStorage.getItem('role');
        if (savedRole === 'admin' || savedRole === 'owner') {
            currentRole = savedRole;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('roleBadge').textContent = savedRole.toUpperCase();
            loadCountrySelect();
            showRooms();
            updateStats();
        }
    </script>
</body>
</html>
