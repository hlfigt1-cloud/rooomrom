<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomRom Pro v6.1 - النظام الذهبي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed; --gold: #fbbf24; --gold-dark: #d97706; --dark-bg: #0f172a;
            --card-bg: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155;
            --success: #10b981; --danger: #ef4444; --owner: #dc2626; --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: var(--text); min-height: 100vh; padding: 15px; }
     .container { max-width: 1600px; margin: 0 auto; }
     .golden-crown { position: fixed; top: 20px; left: 20px; z-index: 1000; animation: float 3s ease-in-out infinite; cursor: pointer; }
     .golden-crown i { font-size: 35px; color: var(--gold); filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
     .ticker { background: linear-gradient(90deg, var(--gold-dark), var(--gold)); color: #000; padding: 12px 0; font-weight: 700; margin-bottom: 20px; border-radius: 12px; overflow: hidden; white-space: nowrap; }
     .ticker-content { display: inline-block; animation: scroll 25s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
     .header { text-align: center; margin-bottom: 25px; }
     .header h1 { font-size: 2.2rem; background: linear-gradient(90deg, var(--primary), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
     .panel { background: var(--card-bg); border-radius: 16px; padding: 25px; margin-bottom: 25px; border: 1px solid var(--border); display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
     .panel.active { display: block; }
     .login-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 25px; }
     .tab-btn { padding: 16px; background: #334155; border: none; border-radius: 12px; color: var(--text); font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
     .tab-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
     .tab-btn.gold { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #000; }
     .tab-btn.owner { background: linear-gradient(135deg, #dc2626, #f87171); color: #fff; }
     .tab-btn.visitor { background: linear-gradient(135deg, #10b981, #34d399); color: #fff; }
     .login-box { max-width: 400px; margin: 20px auto; background: #0f172a; padding: 20px; border-radius: 12px; border: 2px solid var(--primary); }
     .countries-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; }
     .country-card { background: #334155; border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; position: relative; }
     .country-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
     .room-count { position: absolute; top: 8px; right: 8px; background: var(--primary); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
     .active-count { position: absolute; top: 8px; left: 8px; background: var(--success); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
     .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
     .panel-title { font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
     .panel-title.owner { color: var(--owner); }
     .panel-title.admin { color: var(--gold); }
     .logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; }
     .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
     .admin-card { background: #334155; padding: 18px; border-radius: 12px; border: 1px solid var(--border); }
     .admin-card h3 { margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-size: 1.1rem; color: var(--gold); }
     .admin-btn { width: 100%; padding: 11px; margin-top: 8px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.3s; font-size: 0.95rem; }
     .admin-btn:hover { opacity: 0.9; }
     .admin-btn.danger { background: var(--danger); }
     .admin-btn.owner { background: var(--owner); }
     .admin-btn.success { background: var(--success); }
     .admin-btn.warning { background: var(--warning); color: #000; }
        input, select, textarea { width: 100%; padding: 11px; margin: 8px 0; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Tajawal', sans-serif; font-size: 0.95rem; }
        textarea { min-height: 90px; resize: vertical; }
        input[type="datetime-local"] { color-scheme: dark; }
   .room-list { margin-top: 15px; max-height: 350px; overflow-y: auto; }
   .room-item { background: #0f172a; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid var(--primary); }
   .room-item.expired { border-left-color: var(--danger); opacity: 0.6; }
   .room-item.vip { border-left-color: var(--gold); background: linear-gradient(90deg, #0f172a, #1e1b4b); }
   .room-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
   .room-title { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
   .room-actions { display: flex; gap: 5px; }
   .room-actions button { padding: 4px 10px; font-size: 0.75rem; margin: 0; width: auto; }
   .room-info { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }
   .room-info span { display: flex; align-items: center; gap: 4px; }
   .badge { padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; }
   .badge-owner { background: var(--owner); color: white; }
   .badge-admin { background: var(--gold); color: #000; }
   .badge-vip { background: var(--gold); color: #000; }
   .badge-expired { background: var(--danger); color: white; }
   .badge-active { background: var(--success); color: white; }
   .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 15px; }
   .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
   .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--gold); }
   .stat-label { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }
   .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
   .checkbox-group input { width: auto; margin: 0; }
   .divider { height: 1px; background: var(--border); margin: 15px 0; }
    </style>
</head>
