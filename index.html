<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
  }
}
</script>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from 'firebase/auth';
import { getDatabase, ref, set, push, onValue, onDisconnect, serverTimestamp, remove, get, update, query, orderByChild, limitToLast } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyAGpES78mV7-jgEQzi63R0TONGKfUQHFHc",
  authDomain: "hashed-cht.firebaseapp.com",
  databaseURL: "https://hashed-cht-default-rtdb.firebaseio.com",
  projectId: "hashed-cht",
  storageBucket: "hashed-cht.firebasestorage.app",
  messagingSenderId: "442699332645",
  appId: "1:442699332645:web:08d332758ac215a07453cc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const OWNER_CODE = "19952005";
const COUNTRIES = {
  'Iraq': { name: 'العراق', flag: '🇮🇶' }, 'Saudi': { name: 'السعودية', flag: '🇸🇦' }, 'Egypt': { name: 'مصر', flag: '🇪🇬' },
  'UAE': { name: 'الإمارات', flag: '🇦🇪' }, 'Jordan': { name: 'الأردن', flag: '🇯🇴' }, 'Morocco': { name: 'المغرب', flag: '🇲🇦' },
  'Palestine': { name: 'فلسطين', flag: '🇵🇸' }, 'Lebanon': { name: 'لبنان', flag: '🇱🇧' }, 'Kuwait': { name: 'الكويت', flag: '🇰🇼' },
  'Qatar': { name: 'قطر', flag: '🇶🇦' }, 'Oman': { name: 'عمان', flag: '🇴🇲' }, 'Bahrain': { name: 'البحرين', flag: '🇧🇭' },
  'Syria': { name: 'سوريا', flag: '🇸🇾' }, 'Yemen': { name: 'اليمن', flag: '🇾🇪' }, 'Algeria': { name: 'الجزائر', flag: '🇩🇿' },
  'Tunisia': { name: 'تونس', flag: '🇹🇳' }, 'Libya': { name: 'ليبيا', flag: '🇱🇾' }
};

const RANKS = {
  owner: { name: 'مالك', icon: 'fa-crown', color: 'rank-owner', level: 5, protected: true },
  master: { name: 'ماستر', icon: 'fa-star', color: 'rank-master', level: 4 },
  superadmin: { name: 'سوبر أدمن', icon: 'fa-shield-halved', color: 'rank-superadmin', level: 3 },
  admin: { name: 'أدمن', icon: 'fa-shield', color: 'rank-admin', level: 2 },
  member: { name: 'عضو', icon: 'fa-user', color: 'rank-member', level: 1 },
  guest: { name: 'زائر', icon: 'fa-user', color: 'rank-guest', level: 0 }
};

let currentUser = null;
let currentRoom = 'general';
let selectedRoomColor = '#0ea5e9';
let unsubscribeMessages = null;
let unsubscribeUsers = null;
let unsubscribeRooms = null;
let rankCodes = { master: '', superadmin: '' };
let selectedUserForAction = null;

// Populate countries - Fixed
function populateCountries() {
  const countrySelect = document.getElementById('countrySelect');
  if (countrySelect && countrySelect.options.length <= 1) {
    Object.entries(COUNTRIES).forEach(([code, data]) => {
      const option = document.createElement('option');
      option.value = code;
      option.textContent = `${data.flag} ${data.name}`;
      countrySelect.appendChild(option);
    });
  }
}
document.addEventListener('DOMContentLoaded', populateCountries);
setTimeout(populateCountries, 100);

// Load rank codes
onValue(ref(db, 'settings/rankCodes'), (snap) => {
  rankCodes = snap.val() || { master: '', superadmin: '' };
  updateRankCodesDisplay();
});

function updateRankCodesDisplay() {
  const container = document.getElementById('currentRankCodes');
  if (!container) return;
  container.innerHTML = `
    <div class="flex justify-between"><span class="text-red-400">ماستر:</span><span class="text-slate-300">${rankCodes.master || 'غير محدد'}</span></div>
    <div class="flex justify-between"><span class="text-purple-400">سوبر أدمن:</span><span class="text-slate-300">${rankCodes.superadmin || 'غير محدد'}</span></div>
  `;
}

// Auth State
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const userSnap = await get(ref(db, `users/${user.uid}`));
    if (userSnap.exists()) {
      const userData = userSnap.val();
      if (userData.banned) {
        alert('تم حظرك من الدردشة');
        await signOut(auth);
        return;
      }
      currentUser = { uid: user.uid,...userData };
      showMainApp();
      initRealtimeListeners();
    }
  } else {
    currentUser = null;
    showLoginScreen();
  }
});

// Login Form
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-2"></i>جاري الدخول...';

  try {
    const username = document.getElementById('usernameInput').value.trim();
    const country = document.getElementById('countrySelect').value;
    const rankCode = document.getElementById('rankCodeInput').value;

    if (!username ||!country) {
      alert('الرجاء ملء جميع الحقول المطلوبة');
      return;
    }

    const { user } = await signInAnonymously(auth);

    let rank = 'member';
    if (rankCode === OWNER_CODE) {
      rank = 'owner';
    } else if (rankCode === rankCodes.master && rankCodes.master) {
      rank = 'master';
    } else if (rankCode === rankCodes.superadmin && rankCodes.superadmin) {
      rank = 'superadmin';
    }

    const userData = {
      username, country, rank,
      online: true, banned: false, muted: false,
      lastSeen: serverTimestamp(),
      joinedAt: serverTimestamp()
    };

    await set(ref(db, `users/${user.uid}`), userData);
    onDisconnect(ref(db, `users/${user.uid}/online`)).set(false);
    onDisconnect(ref(db, `users/${user.uid}/lastSeen`)).set(serverTimestamp());
    currentUser = { uid: user.uid,...userData };

  } catch (error) {
    console.error('Login error:', error);
    alert('حدث خطأ أثناء تسجيل الدخول');
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket ml-2"></i>دخول الدردشة';
  }
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (confirm('هل تريد تسجيل الخروج؟')) {
    if (currentUser) {
      await set(ref(db, `users/${currentUser.uid}/online`), false);
      await set(ref(db, `users/${currentUser.uid}/lastSeen`), serverTimestamp());
    }
    await signOut(auth);
  }
});

function showLoginScreen() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeUsers) unsubscribeUsers();
  if (unsubscribeRooms) unsubscribeRooms();
}

function showMainApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  updateUserProfile();
  initDefaultRoom();
}

function updateUserProfile() {
  if (!currentUser) return;
  const avatarEl = document.getElementById('userAvatar');
  avatarEl.textContent = currentUser.username.charAt(0).toUpperCase();
  if (currentUser.rank === 'owner') avatarEl.classList.add('owner-badge');
  else avatarEl.classList.remove('owner-badge');
  
  document.getElementById('userDisplayName').textContent = currentUser.username;
  document.getElementById('userFlag').textContent = COUNTRIES[currentUser.country]?.flag || '';
  
  const rankInfo = RANKS[currentUser.rank] || RANKS.guest;
  document.getElementById('userRankIcon').className = `fa-solid ${rankInfo.icon} text-xs ${rankInfo.color}`;
  document.getElementById('userRankText').textContent = rankInfo.name;
  document.getElementById('userRankText').className = `text-xs ${rankInfo.color}`;
  
  if (currentUser.rank === 'owner') {
    document.getElementById('createRoomBtn').classList.remove('hidden');
    document.getElementById('createPremiumRoomBtn').classList.remove('hidden');
    document.getElementById('editWelcomeBtn').classList.remove('hidden');
    document.getElementById('manageRanksBtn').classList.remove('hidden');
  } else if (currentUser.rank === 'master' || currentUser.rank === 'superadmin') {
    document.getElementById('createRoomBtn').classList.remove('hidden');
  }
  
  // Mute check
  if (currentUser.muted) {
    document.getElementBy
