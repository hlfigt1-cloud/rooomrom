<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دردشة عربية | Arab Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc, updateDoc, getDocs, where, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBXB9vVqZKGsJ3XjFdqR3yN3Z1o8Z1o8Z1o",
  authDomain: "chat-room-1a2b3.firebaseapp.com",
  projectId: "chat-room-1a2b3",
  storageBucket: "chat-room-1a2b3.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
signInAnonymously(auth);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.onSnapshot = onSnapshot;
window.query = query;
window.orderBy = orderBy;
window.serverTimestamp = serverTimestamp;
window.doc = doc;
window.deleteDoc = deleteDoc;
window.updateDoc = updateDoc;
window.getDocs = getDocs;
window.where = where;
window.setDoc = setDoc;
window.getDoc = getDoc;
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap');
* { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
body { overscroll-behavior: none; touch-action: pan-y; }
.marquee { white-space: nowrap; overflow: hidden; }
.marquee-content { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
@keyframes marquee { 0% { transform: translate3d(-100%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
.scroll-smooth { scroll-behavior: smooth; }
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.message-appear { animation: slideIn 0.2s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.ripple { position: relative; overflow: hidden; }
.ripple:after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%; background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s; }
.ripple:active:after { width: 300px; height: 300px; }
.pinned-msg { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
@keyframes rainbow { 0% { color: #ff0000; } 16% { color: #ff7f00; } 33% { color: #ffff00; } 50% { color: #00ff00; } 66% { color: #0000ff; } 83% { color: #4b0082; } 100% { color: #9400d3; } }
.owner-name { animation: rainbow 3s linear infinite; font-weight: 900; }
.admin-name { color: #3b82f6; font-weight: 700; }
.mod-name { color: #10b981; font-weight: 700; }
.member-name { color: #6b7280; }
.owner-badge { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
.admin-badge { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
.mod-badge { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
.delete-mode { background: #ef4444!important; }
.msg-selected { background: rgba(239, 68, 68, 0.2)!important; border: 2px solid #ef4444; }
</style>
</head>
<body class="bg-gray-900 text-white">
<div id="app"></div>
<script>
const OWNER_USERNAME = 'الدعم الفني';
const OWNER_PASSWORD = '19952005';
let currentUser = null;
let currentRole = 'member';
let selectedMessages = [];
let deleteMode = false;
let messages = [];
let users = [];

const appDiv = document.getElementById('app');

function init() {
  if (!localStorage.getItem('chatUser')) {
    showLogin();
  } else {
    currentUser = JSON.parse(localStorage.getItem('chatUser'));
    currentRole = currentUser.role || 'member';
    showChat();
    listenMessages();
    listenUsers();
  }
}

function showLogin() {
  appDiv.innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900">
      <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-8 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">دردشة عربية</h1>
        <input id="username" type="text" placeholder="اسم المستخدم" class="w-full p-3 mb-4 bg-gray-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
        <input id="password" type="password" placeholder="كلمة المرور (اختياري)" class="w-full p-3 mb-6 bg-gray-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
        <button onclick="login()" class="w-full p-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg font-bold ripple hover:from-purple-700 hover:to-pink-700 transition">دخول</button>
      </div>
    </div>
  `;
}

window.login = async function() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username) {
    alert('اكتب اسم المستخدم');
    return;
  }

  let role = 'member';
  if (username === OWNER_USERNAME && password === OWNER_PASSWORD) {
    role = 'owner';
  } else {
    const usersRef = window.collection(window.db, 'users');
    const q = window.query(usersRef, window.where('username', '==', username));
    const querySnapshot = await window.getDocs(q);
    if (!querySnapshot.empty) {
      role = querySnapshot.docs[0].data().role || 'member';
    }
  }

  currentUser = { username, role };
  currentRole = role;
  localStorage.setItem('chatUser', JSON.stringify(currentUser));

  const userRef = window.doc(window.db, 'users', username);
  await window.setDoc(userRef, { username, role, lastSeen: window.serverTimestamp() }, { merge: true });

  showChat();
  listenMessages();
  listenUsers();
}function showChat() {
  appDiv.innerHTML = `
    <div class="h-screen flex flex-col">
      <div class="bg-gray-800 p-3 shadow-lg">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="${getRoleClass(currentRole)}">${getRoleIcon(currentRole)} ${currentUser.username}</span>
            ${currentRole === 'owner' ? '<span class="text-xs bg-yellow-500 text-black px-2 py-0.5 rounded-full">مالك</span>' : ''}
            ${currentRole === 'admin' ? '<span class="text-xs bg-blue-500 px-2 py-0.5 rounded-full">ادمن</span>' : ''}
            ${currentRole === 'mod' ? '<span class="text-xs bg-green-500 px-2 py-0.5 rounded-full">مشرف</span>' : ''}
          </div>
          <div class="flex gap-2">
            ${(currentRole === 'owner' || currentRole === 'admin') ? '<button onclick="toggleDeleteMode()" id="deleteBtn" class="px-3 py-1 bg-red-600 rounded-lg text-sm ripple">🗑️ حذف</button>' : ''}
            ${currentRole === 'owner' ? '<button onclick="showAdminPanel()" class="px-3 py-1 bg-purple-600 rounded-lg text-sm ripple">⚙️ ادارة</button>' : ''}
            <button onclick="logout()" class="px-3 py-1 bg-gray-700 rounded-lg text-sm ripple">خروج</button>
          </div>
        </div>
        <div id="pinnedMessage" class="hidden pinned-msg p-2 rounded-lg text-sm text-black font-bold"></div>
      </div>

      <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 scroll-smooth hide-scrollbar"></div>

      <div class="bg-gray-800 p-3">
        <div class="flex gap-2">
          <input id="messageInput" type="text" placeholder="اكتب رسالتك..." class="flex-1 p-3 bg-gray-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500" onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg font-bold ripple">ارسل</button>
        </div>
      </div>
    </div>

    <div id="adminModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
      <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-md max-h-[80vh] overflow-y-auto">
        <h2 class="text-2xl font-bold mb-4">لوحة التحكم</h2>
        <div id="usersList" class="space-y-2 mb-4"></div>
        <button onclick="closeAdminPanel()" class="w-full p-3 bg-gray-700 rounded-lg ripple">اغلاق</button>
      </div>
    </div>
  `;
}

function getRoleClass(role) {
  if (role === 'owner') return 'owner-name';
  if (role === 'admin') return 'admin-name';
  if (role === 'mod') return 'mod-name';
  return 'member-name';
}

function getRoleIcon(role) {
  if (role === 'owner') return '👑';
  if (role === 'admin') return '⭐';
  if (role === 'mod') return '🛡️';
  return '👤';
}

function getRoleBadge(role) {
  if (role === 'owner') return '<span class="owner-badge text-xs px-2 py-0.5 rounded-full text-black font-bold">👑 مالك</span>';
  if (role === 'admin') return '<span class="admin-badge text-xs px-2 py-0.5 rounded-full">⭐ ادمن</span>';
  if (role === 'mod') return '<span class="mod-badge text-xs px-2 py-0.5 rounded-full">🛡️ مشرف</span>';
  return '';
}

window.sendMessage = async function() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;

  await window.addDoc(window.collection(window.db, 'messages'), {
    text,
    username: currentUser.username,
    role: currentRole,
    timestamp: window.serverTimestamp(),
    pinned: false
  });

  input.value = '';
}

function listenMessages() {
  const q = window.query(window.collection(window.db, 'messages'), window.orderBy('timestamp', 'asc'));
  window.onSnapshot(q, (snapshot) => {
    messages = [];
    snapshot.forEach((doc) => {
      messages.push({ id: doc.id, ...doc.data() });
    });
    renderMessages();
  });
}

function renderMessages() {
  const messagesDiv = document.getElementById('messages');
  if (!messagesDiv) return;

  const pinnedMsg = messages.find(m => m.pinned);
  const pinnedDiv = document.getElementById('pinnedMessage');
  if (pinnedMsg && pinnedDiv) {
    pinnedDiv.classList.remove('hidden');
    pinnedDiv.innerHTML = `📌 ${pinnedMsg.text} - ${pinnedMsg.username}`;
  } else if (pinnedDiv) {
    pinnedDiv.classList.add('hidden');
  }

  messagesDiv.innerHTML = messages.map(msg => {
    const isSelected = selectedMessages.includes(msg.id);
    const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' }) : '';
    return `
      <div class="message-appear ${isSelected ? 'msg-selected' : 'bg-gray-800'} p-3 rounded-lg ${deleteMode ? 'cursor-pointer' : ''}" onclick="${deleteMode ? `toggleSelectMessage('${msg.id}')` : ''}">
        <div class="flex items-start justify-between mb-1">
          <div class="flex items-center gap-2">
            <span class="${getRoleClass(msg.role)}">${getRoleIcon(msg.role)} ${msg.username}</span>
            ${getRoleBadge(msg.role)}
          </div>
          <span class="text-xs text-gray-500">${time}</span>
        </div>
        <p class="text-gray-200 break-words">${msg.text}</p>
        ${(currentRole === 'owner' || currentRole === 'admin' || currentRole === 'mod') && !deleteMode ? `
          <div class="flex gap-2 mt-2">
            <button onclick="pinMessage('${msg.id}')" class="text-xs px-2 py-1 bg-yellow-600 rounded ripple">📌 تثبيت</button>
            <button onclick="deleteMessage('${msg.id}')" class="text-xs px-2 py-1 bg-red-600 rounded ripple">🗑️ حذف</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

window.toggleDeleteMode = function() {
  deleteMode = !deleteMode;
  selectedMessages = [];
  const btn = document.getElementById('deleteBtn');
  if (deleteMode) {
    btn.classList.add('delete-mode');
    btn.innerHTML = `✓ حذف المحدد (${selectedMessages.length})`;
  } else {
    btn.classList.remove('delete-mode');
    btn.innerHTML = '🗑️ حذف';
  }
  renderMessages();
}

window.toggleSelectMessage = function(id) {
  if (!deleteMode) return;
  const idx = selectedMessages.indexOf(id);
  if (idx > -1) {
    selectedMessages.splice(idx, 1);
  } else {
    selectedMessages.push(id);
  }
  document.getElementById('deleteBtn').innerHTML = `✓ حذف المحدد (${selectedMessages.length})`;
  renderMessages();
}

window.deleteMessage = async function(id) {
  if (confirm('حذف الرسالة؟')) {
    await window.deleteDoc(window.doc(window.db, 'messages', id));
  }
}

window.pinMessage = async function(id) {
  const messagesRef = window.collection(window.db, 'messages');
  const q = window.query(messagesRef, window.where('pinned', '==', true));
  const snapshot = await window.getDocs(q);
  snapshot.forEach(async (doc) => {
    await window.updateDoc(window.doc(window.db, 'messages', doc.id), { pinned: false });
  });
  await window.updateDoc(window.doc(window.db, 'messages', id), { pinned: true });
}window.showAdminPanel = function() {
  document.getElementById('adminModal').classList.remove('hidden');
  renderUsers();
}

window.closeAdminPanel = function() {
  document.getElementById('adminModal').classList.add('hidden');
}

function listenUsers() {
  const q = window.query(window.collection(window.db, 'users'), window.orderBy('lastSeen', 'desc'));
  window.onSnapshot(q, (snapshot) => {
    users = [];
    snapshot.forEach((doc) => {
      users.push({ id: doc.id, ...doc.data() });
    });
    if (document.getElementById('adminModal') && !document.getElementById('adminModal').classList.contains('hidden')) {
      renderUsers();
    }
  });
}

function renderUsers() {
  const usersDiv = document.getElementById('usersList');
  if (!usersDiv) return;
  
  usersDiv.innerHTML = users.map(user => `
    <div class="bg-gray-700 p-3 rounded-lg flex items-center justify-between">
      <div>
        <span class="${getRoleClass(user.role)}">${getRoleIcon(user.role)} ${user.username}</span>
        <div class="text-xs text-gray-400">${getRoleBadge(user.role)}</div>
      </div>
      ${currentRole === 'owner' && user.username !== currentUser.username ? `
        <div class="flex gap-1">
          <button onclick="changeRole('${user.username}', 'admin')" class="text-xs px-2 py-1 bg-blue-600 rounded ripple">ادمن</button>
          <button onclick="changeRole('${user.username}', 'mod')" class="text-xs px-2 py-1 bg-green-600 rounded ripple">مشرف</button>
          <button onclick="changeRole('${user.username}', 'member')" class="text-xs px-2 py-1 bg-gray-600 rounded ripple">عضو</button>
          <button onclick="kickUser('${user.username}')" class="text-xs px-2 py-1 bg-red-600 rounded ripple">طرد</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

window.changeRole = async function(username, newRole) {
  if (confirm(`تغيير رتبة ${username} الى ${newRole}؟`)) {
    await window.updateDoc(window.doc(window.db, 'users', username), { role: newRole });
  }
}

window.kickUser = async function(username) {
  if (confirm(`طرد ${username}؟`)) {
    await window.deleteDoc(window.doc(window.db, 'users', username));
  }
}

window.logout = function() {
  localStorage.removeItem('chatUser');
  currentUser = null;
  currentRole = 'member';
  location.reload();
}

// حذف الرسائل المحددة
document.addEventListener('click', async (e) => {
  if (e.target.id === 'deleteBtn' && deleteMode && selectedMessages.length > 0) {
    if (confirm(`حذف ${selectedMessages.length} رسالة؟`)) {
      for (const msgId of selectedMessages) {
        await window.deleteDoc(window.doc(window.db, 'messages', msgId));
      }
      selectedMessages = [];
      toggleDeleteMode();
    }
  }
});

init();
</script>
</body>
</html>
