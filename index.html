                    </button>
                </div>

                <div id="loginBox" class="hidden">
                    <h3 id="loginTitle" style="margin-bottom: 15px;"></h3>
                    <input type="password" id="loginPass" placeholder="ادخل كلمة السر">
                    <button class="admin-btn" onclick="checkLogin()">دخول</button>
                </div>

                <div class="countries-grid" id="countriesGrid"></div>
            </div>
        </div>

        <!-- لوحة المالك -->
        <div id="ownerPanel" class="panel">
            <div class="panel-header">
                <h2 class="panel-title owner"><i class="fas fa-shield-halved"></i> لوحة المالك <span class="badge badge-owner">OWNER</span></h2>
                <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
            </div>
            <div class="admin-grid">
                <div class="admin-card">
                    <h3 style="color: var(--owner)"><i class="fas fa-key"></i> إدارة كلمات السر</h3>
                    <input type="password" id="newAdminPass" placeholder="كلمة سر الماستر الجديدة">
                    <button class="admin-btn owner" onclick="changePassword('admin')">تغيير باسورد الماستر</button>
                    <input type="password" id="newOwnerPass" placeholder="كلمة سر المالك الجديدة">
                    <button class="admin-btn owner" onclick="changePassword('owner')">تغيير باسورد المالك</button>
                </div>
                <div class="admin-card">
                    <h3 style="color: var(--owner)"><i class="fas fa-globe"></i> إدارة الدول</h3>
                    <input type="text" id="newCountryName" placeholder="اسم الدولة">
                    <input type="text" id="newCountryFlag" placeholder="العلم 🇮🇶">
                    <button class="admin-btn owner" onclick="addCountry()">إضافة دولة</button>
                    <button class="admin-btn danger" onclick="deleteCountry()">حذف دولة</button>
                </div>
                <div class="admin-card">
                    <h3 style="color: var(--owner)"><i class="fas fa-chart-line"></i> احصائيات النظام</h3>
                    <div class="stats" id="ownerStats"></div>
                    <button class="admin-btn owner" onclick="exportData()">تصدير البيانات</button>
                    <button class="admin-btn owner" onclick="document.getElementById('importFile').click()">استيراد البيانات</button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </div>
                <div class="admin-card">
                    <h3 style="color: var(--owner)"><i class="fas fa-trash"></i> إدارة متقدمة</h3>
                    <button class="admin-btn warning" onclick="clearExpiredRooms()">حذف كل الغرف المنتهية</button>
                    <button class="admin-btn danger" onclick="resetSystem()">حذف النظام بالكامل ⚠️</button>
                </div>
            </div>
        </div>

        <!-- لوحة الماستر -->
        <div id="adminPanel" class="panel">
            <div class="panel-header">
                <h2 class="panel-title admin"><i class="fas fa-crown"></i> لوحة الماستر <span class="badge badge-admin">ADMIN</span></h2>
                <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
            </div>
            <div class="admin-grid">
                <div class="admin-card">
                    <h3 style="color: var(--gold)"><i class="fas fa-door-open"></i> إضافة غرف - بكيفك</h3>
                    <select id="countrySelect" onchange="showRooms()"></select>
                    
                    <div class="quick-add">
                        <input type="text" id="roomName" placeholder="اسم غرفة وحدة">
                        <button class="admin-btn success" onclick="addSingleRoom()" style="margin:0">إضافة</button>
                    </div>
                    
                    <textarea id="roomsTextarea" placeholder="او الصق اسماء الغرف هنا - كل غرفة بسطر:&#10;غرفة بغداد 1&#10;غرفة بغداد 2&#10;غرفة بغداد VIP&#10;غرفة بغداد كبار&#10;..."></textarea>
                    
                    <input type="datetime-local" id="roomExpiry" placeholder="تاريخ الانتهاء (اختياري)">
                    <input type="number" id="roomMaxUsers" placeholder="الحد الاقصى للاعضاء (اختياري)">
                    <input type="password" id="roomPassword" placeholder="كلمة سر الغرفة (اختياري)">
                    <div class="checkbox-group">
                        <input type="checkbox" id="roomVIP">
                        <label for="roomVIP">غرفة VIP ⭐</label>
                    </div>
                    
                    <button class="admin-btn success" onclick="addMultipleRooms()">
                        <i class="fas fa-plus-circle"></i> إضافة كل الغرف المكتوبة مرة وحدة
                    </button>
                </div>
                <div class="admin-card">
                    <h3 style="color: var(--gold)"><i class="fas fa-list"></i> غرف الدولة المحددة</h3>
                    <div class="stats">
                        <div class="stat-box"><div class="stat-num" id="currentRoomCount">0</div><div>كل الغرف</div></div>
                        <div class="stat-box"><div class="stat-num" id="currentActiveCount">0</div><div>نشطة</div></div>
                        <div class="stat-box"><div class="stat-num" id="currentExpiredCount">0</div><div>منتهية</div></div>
                    </div>
                    <button class="admin-btn warning" onclick="clearExpiredRooms()">حذف المنتهية فقط</button>
                    <button class="admin-btn danger" onclick="clearAllRooms()">حذف كل الغرف</button>
                    <div class="room-list" id="roomList"></div>
                </div>
                <div class="admin-card">
                    <h3 style="color: var(--gold)"><i class="fas fa-bullhorn"></i> رسائل جماعية</h3>
                    <textarea id="broadcastMsg" placeholder="اكتب الرسالة الجماعية..."></textarea>
                    <button class="admin-btn" onclick="sendBroadcast()">ارسال للكل</button>
                </div>
                <div class="admin-card">
                    <h3 style="color: var(--gold)"><i class="fas fa-cog"></i> أدوات سريعة</h3>
                    <button class="admin-btn" onclick="exportData()">تصدير البيانات</button>
                    <button class="admin-btn warning" onclick="clearExpiredRooms()">تنظيف الغرف المنتهية</button>
                    <button class="admin-btn" onclick="showInfo()">معلومات النظام</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let PASSWORDS = JSON.parse(localStorage.getItem('passwords')) || { owner: 'owner2026', admin: 'admin2026' };
        let currentRole = '';
        
        let countries = JSON.parse(localStorage.getItem('countries')) || [
            { name: 'السعودية', flag: '🇸🇦', users: 12450, rooms: [
                { name: 'الرياض VIP', expiry: '2026-12-31T23:59', maxUsers: 100, password: '', vip: true, created: Date.now() },
                { name: 'جدة العامة', expiry: null, maxUsers: 50, password: '', vip: false, created: Date.now() }
            ]},
            { name: 'العراق', flag: '🇮🇶', users: 8920, rooms: [
                { name: 'بغداد 1', expiry: '2026-06-01T00:00', maxUsers: 200, password: '123', vip: false, created: Date.now() }
            ]},
            { name: 'مصر', flag: '🇪🇬', users: 15300, rooms: [] },
            { name: 'الإمارات', flag: '🇦🇪', users: 6780, rooms: [] }
        ];

        function saveData() {
            localStorage.setItem('countries', JSON.stringify(countries));
            localStorage.setItem('passwords', JSON.stringify(PASSWORDS));
            renderCountries();
            updateStats();
        }

        function isExpired(room) {
            if (!room.expiry) return false;
            return new Date(room.expiry) < new Date();
        }

        function formatExpiry(expiry) {
            if (!expiry) return 'دائم';
            const date = new Date(expiry);
            const now = new Date();
            const diff = date - now;
            if (diff < 0) return 'منتهي ❌';
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            if (days > 0) return `${days} يوم متبقي`;
            if (hours > 0) return `${hours} ساعة متبقية`;
            return 'اقل من ساعة';
        }

        function showLogin(role) {
            currentRole = role;
            const titles = { owner: 'دخول المالك الرئيسي 👑', admin: 'دخول الماستر' };
            document.getElementById('loginTitle').textContent = titles[role];
            document.getElementById('loginBox').classList.remove('hidden');
        }

        function checkLogin() {
            const pass = document.getElementById('loginPass').value;
            if (pass === PASSWORDS[currentRole]) {
                document.getElementById('loginSection').style.display = 'none';
                if (currentRole === 'owner') {
                    document.getElementById('ownerPanel').style.display = 'block';
                } else {
                    document.getElementById('adminPanel').style.display = 'block';
                    loadCountrySelect();
                }
                localStorage.setItem('role', currentRole);
                document.getElementById('loginPass').value = '';
            } else {
                alert('❌ كلمة السر غلط');
            }
        }

        function logout() {
            localStorage.removeItem('role');
            location.reload();
        }

        function renderCountries() {
            const grid = document.getElementById('countriesGrid');
            grid.innerHTML = countries.map(c => {
                const activeRooms = c.rooms.filter(r =>!isExpired(r)).length;
                return `
                <div class="country-card" onclick="showCountryRooms('${c.name}')">
                    <div class="room-count">${c.rooms.length} غرف</div>
                    <div class="active-count">${activeRooms} نشطة</div>
                    <div style="font-size: 2.5rem">${c.flag}</div>
                    <div style="font-weight: 700; margin: 10px 0">${c.name}</div>
                    <div style="color: var(--text-muted); font-size: 0.85rem">${c.users.toLocaleString()} عضو</div>
                </div>
            `}).join('');
        }

        function loadCountrySelect() {
            const select = document.getElementById('countrySelect');
            select.innerHTML = countries.map(c => `<option value="${c.name}">${c.flag} ${c.name}</option>`).join('');
            showRooms();
        }

        function addSingleRoom() {
            const countryName = document.getElementById('countrySelect').value;
            const roomName = document.getElementById('roomName').value.trim();
            if (!roomName) return alert('اكتب اسم الغرفة');
            
            const country = countries.find(c => c.name === countryName);
            if (country.rooms.find(r => r.name === roomName)) return alert('الغرفة موجودة مسبقاً');
            
            const room = {
                name: roomName,
                expiry: document.getElementById('roomExpiry').value || null,
                maxUsers: parseInt(document.getElementById('roomMaxUsers').value) || 0,
                password: document.getElementById('roomPassword').value || '',
                vip: document.getElementById('roomVIP').checked,
                created: Date.now()
            };
            
            country.rooms.push(room);
            clearRoomForm();
            saveData();
            showRooms();
            alert('✅ تم اضافة الغرفة: ' + roomName);
        }

        function addMultipleRooms() {
            const countryName = document.getElementById('countrySelect').value;
            const roomsText = document.getElementById('roomsTextarea').value.trim();
            
            if (!roomsText) return alert('اكتب اسماء الغرف اولاً');
            
            const roomNames = roomsText.split('\n').map(r => r.trim()).filter(r => r);
            if (roomNames.length === 0) return alert('ما لكيت اسماء غرف');
            
            const country = countries.find(c => c.name === countryName);
            const expiry = document.getElementById('roomExpiry').value || null;
            const maxUsers = parseInt(document.getElementById('roomMaxUsers').value) || 0;
            const password = document.getElementById('roomPassword').value || '';
            const vip = document.getElementById('roomVIP').checked;
            
            const added = [];
            const duplicates = [];
            
            roomNames.forEach(name => {
                if (!country.rooms.find(r => r.name === name)) {
                    country.rooms.push({
                        name: name,
                        expiry: expiry,
                        maxUsers: maxUsers,
                        password: password,
                        vip: vip,
                        created: Date.now()
                    });
                    added.push(name);
                } else {
                    duplicates.push(name);
                }
            });
            
            clearRoomForm();
            saveData();
            showRooms();
            
            let msg = `✅ تم اضافة ${added.length} غرفة`;
            if (duplicates.length > 0) msg += `\n⚠️ ${duplicates.length} غرفة مكررة تم تجاهلها`;
            alert(msg);
        }

        function clearRoomForm() {
            document.getElementById('roomName').value = '';
            document.getElementById('roomsTextarea').value = '';
            document.getElementById('roomExpiry').value = '';
            document.getElementById('roomMaxUsers').value = '';
            document.getElementById('roomPassword').value = '';
            document.getElementById('roomVIP').checked = false;
        }

        function showRooms() {
            const countryName = document.getElementById('countrySelect').value;
            const country = countries.find(c => c.name === countryName);
            const list = document.getElementById('roomList');
            const activeRooms = country.rooms.filter(r =>!isExpired(r));
            const expiredRooms = country.rooms.filter(r => isExpired(r));
            
            document.getElementById('currentRoomCount').textContent = country.rooms.length;
            document.getElementById('currentActiveCount').textContent = activeRooms.length;
            document.getElementById('currentExpiredCount').textContent = expiredRooms.length;
            
            if (country.rooms.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px">لا توجد غرف</p>';
                return;
            }
            
            list.innerHTML = country.rooms.map((r, i) => {
                const expired = isExpired(r);
                const statusClass = expired? 'expired' : r.vip? 'vip' : '';
                const statusBadge = expired? '<span class="badge badge-expired">منتهية</span>' : 
                                   r.vip? '<span class="badge badge-vip">VIP ⭐</span>' : 
                                   '<span class="badge badge-active">نشطة</span>';
                
                return `
                <div class="room-item
