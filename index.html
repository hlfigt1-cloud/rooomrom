<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

<!-- Login Page -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4 gradient-bg">
    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full mb-4">
                <i class="fa-solid fa-comments text-white text-3xl"></i>
            </div>
            <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">شات عربي</h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm">دردشة عربية مجانية - متواجدون 24/7</p>
            <div class="flex items-center justify-center gap-2 mt-3">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-sm text-green-600 dark:text-green-400 font-semibold" id="onlineStatus">متصل الآن</span>
            </div>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">اسم المستخدم</label>
                <input type="text" id="username" placeholder="اكتب اسمك هنا..." 
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-slate-600 dark:bg-slate-700 focus:border-purple-500 focus:outline-none transition"
                    required maxlength="20">
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-2">كلمة المرور <span class="text-gray-400 text-xs">(اختياري)</span></label>
                <input type="password" id="password" placeholder="للعضوية فقط" 
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-slate-600 dark:bg-slate-700 focus:border-purple-500 focus:outline-none transition">
            </div>
            
            <div class="flex items-center gap-2 p-3 bg-blue-50 dark:bg-slate-700 rounded-xl">
                <input type="checkbox" id="guestLogin" class="w-4 h-4 text-purple-600 rounded">
                <label for="guestLogin" class="text-sm">الدخول كزائر بدون عضوية</label>
            </div>
            
            <button type="submit" 
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                <i class="fa-solid fa-right-to-bracket ml-2"></i>
                دخول سريع
            </button>
        </form>
        
        <div class="mt-6 text-center text-xs text-gray-400">
            <p>بالدخول أنت توافق على قوانين الدردشة</p>
        </div>
    </div>
</div>

<!-- Main Chat App -->

                    </div>
                </button>

                <button id="banUserBtn" class="w-full flex items-center gap-3 p-3 bg-red-50 dark:bg-slate-700 hover:bg-red-100 dark:hover:bg-slate-600 rounded-xl transition">
                    <i class="fa-solid fa-ban text-red-600 text-xl"></i>
                    <div class="text-right">
                        <div class="font-bold">حظر مستخدم</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">منع مستخدم من الدخول نهائياً</div>
                    </div>
                </button>

                <button id="muteUserBtn" class="w-full flex items-center gap-3 p-3 bg-yellow-50 dark:bg-slate-700 hover:bg-yellow-100 dark:hover:bg-slate-600 rounded-xl transition">
                    <i class="fa-solid fa-volume-xmark text-yellow-600 text-xl"></i>
                    <div class="text-right">
                        <div class="font-bold">كتم مستخدم</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">منع المستخدم من الكتابة</div>
                    </div>
                </button>

                <button id="announcementBtn" class="w-full flex items-center gap-3 p-3 bg-blue-50 dark:bg-slate-700 hover:bg-blue-100 dark:hover:bg-slate-600 rounded-xl transition">
                    <i class="fa-solid fa-bullhorn text-blue-600 text-xl"></i>
                    <div class="text-right">
                        <div class="font-bold">إعلان عام</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">تثبيت إعلان في أعلى الدردشة</div>
                    </div>
                </button>

                <button id="renameRoomBtn" class="w-full flex items-center gap-3 p-3 bg-purple-50 dark:bg-slate-700 hover:bg-purple-100 dark:hover:bg-slate-600 rounded-xl transition">
                    <i class="fa-solid fa-pen-to-square text-purple-600 text-xl"></i>
                    <div class="text-right">
                        <div class="font-bold">تغيير اسم الغرفة</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">تعديل اسم الغرفة الحالية</div>
                    </div>
                </button>

                <button id="invisibleModeBtn" class="w-full flex items-center gap-3 p-3 bg-gray-50 dark:bg-slate-700 hover:bg-gray-100 dark:hover:bg-slate-600 rounded-xl transition">
                    <i class="fa-solid fa-ghost text-gray-600 dark:text-gray-400 text-xl"></i>
                    <div class="text-right">
                        <div class="font-bold">الوضع الخفي</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">إخفاء ظهورك للمستخدمين</div>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // State Management
    const state = {
        currentUser: null,
        currentRoom: 'عامة',
        isOwner: false,
        isInvisible: false,
        users: [],
        messages: {},
        bannedUsers: [],
        mutedUsers: [],
        announcement: '',
        textColor: '#000000',
        textSize: '16',
        darkMode: false
    };

    // Initialize from localStorage
    function initStorage() {
        const saved = localStorage.getItem('arabicChatData');
        if (saved) {
            const data = JSON.parse(saved);
            state.bannedUsers = data.bannedUsers || [];
            state.mutedUsers = data.mutedUsers || [];
            state.announcement = data.announcement || '';
            state.darkMode = data.darkMode || false;
        }
        if (state.darkMode) {
            document.documentElement.classList.add('dark');
        }
    }

    function saveStorage() {
        localStorage.setItem('arabicChatData', JSON.stringify({
            bannedUsers: state.bannedUsers,
            mutedUsers: state.mutedUsers,
            announcement: state.announcement,
            darkMode: state.darkMode
        }));
    }

    // DOM Elements
    const loginPage = document.getElementById('loginPage');
    const chatApp = document.getElementById('chatApp');
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const guestLoginCheckbox = document.getElementById('guestLogin');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const usersList = document.getElementById('usersList');
    const mobileUsersList = document.getElementById('mobileUsersList');
    const onlineCount = document.getElementById('onlineCount');
    const userCount = document.getElementById('userCount');
    const mobileUserCount = document.getElementById('mobileUserCount');
    const adminPanelBtn = document.getElementById('adminPanelBtn');
    const adminModal = document.getElementById('adminModal');
    const closeAdminModal = document.getElementById('closeAdminModal');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const logoutBtn = document.getElementById('logoutBtn');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');
    const imageUploadBtn = document.getElementById('imageUploadBtn');
    const imageInput = document.getElementById('imageInput');
    const voiceBtn = document.getElementById('voiceBtn');
    const toggleFormatBtn = document.getElementById('toggleFormatBtn');
    const formatToolbar = document.getElementById('formatToolbar');
    const textColorBtn = document.getElementById('textColorBtn');
    const colorPicker = document.getElementById('colorPicker');
    const textSizeSelect = document.getElementById('textSizeSelect');
    const announcementBar = document.getElementById('announcementBar');
    const announcementText = document.getElementById('announcementText');
    const closeAnnouncement = document.getElementById('closeAnnouncement');
    const mobileUsersBtn = document.getElementById('mobileUsersBtn');
    const mobileUsersDrawer = document.getElementById('mobileUsersDrawer');
    const closeMobileUsers = document.getElementById('closeMobileUsers');

    // Login Handler
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const isGuest = guestLoginCheckbox.checked;

        if (!username) {
            alert('الرجاء إدخال اسم المستخدم');
            return;
        }

        if (state.bannedUsers.includes(username)) {
            alert('تم حظرك من الدردشة');
            return;
        }

        // Check owner credentials
        if (username === 'الدعم الفني' && password === '19951995') {
            state.isOwner = true;
            adminPanelBtn.classList.remove('hidden');
        }

        state.currentUser = {
            username: username,
            isGuest: isGuest,
            joinTime: Date.now(),
            isOwner: state.isOwner
        };

        // Initialize room messages
        if (!state.messages[state.currentRoom]) {
            state.messages[state.currentRoom] = [];
        }

        // Add user to users list
        if (!state.isInvisible) {
            state.users.push(state.currentUser);
            updateUsersList();
        }

        loginPage.classList.add('hidden');
        chatApp.classList.remove('hidden');
        messageInput.focus();

        // Show announcement if exists
        if (state.announcement) {
            showAnnouncement(state.announcement);
        }

        // Add welcome message
        addSystemMessage(`مرحباً ${username}، أهلاً بك في شات عربي!`);
    });

    // Room Switching
    document.querySelectorAll('.room-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const room = tab.dataset.room;
            switchRoom(room);
        });
    });

    function switchRoom(roomName) {
        state.currentRoom = roomName;
        
        // Update UI
        document.querySelectorAll('.room-tab').forEach(tab => {
            if (tab.dataset.room === roomName) {
                tab.classList.add('active', 'bg-purple-600', 'text-white');
                tab.classList.remove('bg-gray-100', 'dark:bg-slate-700');
            } else {
                tab.classList.remove('active', 'bg-purple-600', 'text-white');
                tab.classList.add('bg-gray-100', 'dark:bg-slate-700');
            }
        });

        // Clear and reload messages
        messagesContainer.innerHTML = '';
        if (!state.messages[roomName]) {
            state.messages[roomName] = [];
        }
        state.messages[roomName].forEach(msg => renderMessage(msg));
        
        if (state.messages[roomName].length === 0) {
            messagesContainer.innerHTML = '<div class="text-center text-gray-400 text-sm py-8"><i class="fa-solid fa-comment-dots text-4xl mb-2"></i><p>ابدأ المحادثة الآن!</p></div>';
        }
    }

    // Send Message
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        if (state.mutedUsers.includes(state.currentUser.username)) {
            alert('تم كتمك ولا يمكنك إرسال رسائل');
            return;
        }

        const message = {
            id: Date.now(),
            username: state.currentUser.username,
            text: text,
            timestamp: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }),
            isOwner: state.isOwner,
            color: state.textColor,
            size: state.textSize,
            type: 'text'
        };

        if (!state.messages[state.currentRoom]) {
            state.messages[state.currentRoom] = [];
        }
        state.messages[state.currentRoom].push(message);
        renderMessage(message);
        
        messageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 128) + 'px';
    });

    // Render Message
    function renderMessage(msg) {
        if (msg.type === 'system') {
            const div = document.createElement('div');
            div.className = 'text-center text-xs text-gray-500 dark:text-gray-400 py-2';
            div.innerHTML = `<i class="fa-solid fa-circle-info ml-1"></i>${msg.text}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return;
        }

        const isOwn = msg.username === state.currentUser?.username;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-enter flex gap-3 ${isOwn ? 'flex-row-reverse' : ''}`;
        messageDiv.dataset.messageId = msg.id;

        const avatar = document.createElement('div');
        avatar.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0 ${msg.isOwner ? 'bg-gradient-to-br from-red-500 to-red-700' : 'bg-gradient-to-br from-purple-500 to-pink-500'}`;
        avatar.textContent = msg.username.charAt(0);

        const content = document.createElement('div');
        content.className = `flex-1 max-w-md ${isOwn ? 'text-left' : ''}`;

        const header = document.createElement('div');
        header.className = `flex items-center gap-2 mb-1 ${isOwn ? 'justify-end' : ''}`;
        
        const username = document.createElement('span');
        username.className = `font-bold text-sm ${msg.isOwner ? 'text-red-600 dark:text-red-400' : 'text-purple-600 dark:text-purple-400'}`;
        username.textContent = msg.username;
        
        if (msg.isOwner) {
            const badge = document.createElement('span');
            badge.className = 'owner-badge text-white text-xs px-2 py-0.5 rounded-full font-bold';
            badge.innerHTML = '<i class="fa-solid fa-crown ml-1"></i>المالك';
            header.appendChild(badge);
        }
        
        header.appendChild(username);

        const time = document.createElement('span');
        time.className = 'text-xs text-gray-400';
        time.textContent = msg.timestamp;
        header.appendChild(time);

        if (state.isOwner && !isOwn) {
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'text-red-500 hover:text-red-700 text-xs p-1';
            deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
            deleteBtn.onclick = () => deleteMessage(msg.id);
            header.appendChild(deleteBtn);
        }

        const bubble = document.createElement('div');
        bubble.className = `rounded-2xl px-4 py-2 ${isOwn ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white' : 'bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700'}`;
        bubble.style.fontSize = msg.size + 'px';
        bubble.style.color = isOwn ? 'white' : msg.color;

        if (msg.type === 'image') {
            const img = document.createElement('img');
            img.src = msg.imageUrl;
            img.className = 'max-w-full rounded-lg cursor-pointer';
            img.onclick = () => window.open(msg.imageUrl, '_blank');
            bubble.appendChild(img);
        } else if (msg.type === 'voice') {
            bubble.innerHTML = `<i class="fa-solid fa-microphone ml-2"></i>رسالة صوتية (${msg.duration}s)`;
        } else {
            bubble.textContent = msg.text;
        }

        content.appendChild(header);
        content.appendChild(bubble);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addSystemMessage(text) {
        const msg = { type: 'system', text: text };
        if (!state.messages[state.currentRoom]) {
            state.messages[state.currentRoom] = [];
        }
        renderMessage(msg);
    }

    function deleteMessage(messageId) {
        if (!state.isOwner) return;
        state.messages[state.currentRoom] = state.messages[state.currentRoom].filter(m => m.id !== messageId);
        const msgEl = document.querySelector(`[data-message-id="${messageId}"]`);
        if (msgEl) msgEl.remove();
    }

    // Update Users List
    function updateUsersList() {
        const visibleUsers = state.users.filter(u => !state.isInvisible || u.username === state.currentUser?.username);
        const count = visibleUsers.length;
        
        onlineCount.textContent = count;
        userCount.textContent = count;
        mobileUserCount.textContent = count;

        const renderUser = (user) => {
            const isCurrentUser = user.username === state.currentUser?.username;
            const div = document.createElement('div');
            div.className = 'flex items-center gap-3 p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition';
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold ${user.isOwner ? 'bg-gradient-to-br from-red-500 to-red-700' : 'bg-gradient-to-br from-purple-500 to-pink-500'}`;
            avatar.textContent = user.username.charAt(0);
            
            const info = document.createElement('div');
            info.className = 'flex-1';
            const name = document.createElement('div');
            name.className = `font-semibold text-sm ${user.isOwner ? 'text-red-600 dark:text-red-400' : ''}`;
            name.innerHTML = user.username + (user.isOwner ? ' <i class="fa-solid fa-crown text-xs text-yellow-500"></i>' : '') + (isCurrentUser ? ' <span class="text-xs text-gray-400">(أنت)</span>' : '');
            info.appendChild(name);
            
            div.appendChild(avatar);
            div.appendChild(info);
            
            if (state.isOwner && !isCurrentUser && !user.isOwner) {
                const actions = document.createElement('div');
                actions.className = 'flex gap-1';
                
                const kickBtn = document.createElement('button');
                kickBtn.className = 'text-orange-500 hover:text-orange-700 p-1';
                kickBtn.innerHTML = '<i class="fa-solid fa-user-slash text-xs"></i>';
                kickBtn.title = 'طرد';
                kickBtn.onclick = () => kickUser(user.username);
                actions.appendChild(kickBtn);
                
                div.appendChild(actions);
            }
            
            return div;
        };

        usersList.innerHTML = '';
        mobileUsersList.innerHTML = '';
        visibleUsers.forEach(user => {
            usersList.appendChild(renderUser(user));
            mobileUsersList.appendChild(renderUser(user).cloneNode(true));
        });
    }

    // Emoji Picker
    emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        emojiPicker.classList.toggle('hidden');
    });

    emojiPicker.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
            messageInput.value += btn.textContent;
            emojiPicker.classList.add('hidden');
            messageInput.focus();
        });
    });

    document.addEventListener('click', () => {
        emojiPicker.classList.add('hidden');
    });

    // Image Upload
    imageUploadBtn.addEventListener('click', () => {
        imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const message = {
                id: Date.now(),
                username: state.currentUser.username,
                imageUrl: event.target.result,
                timestamp: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }),
                isOwner: state.isOwner,
                type: 'image'
            };

            if (!state.messages[state.currentRoom]) {
                state.messages[state.currentRoom] = [];
            }
            state.messages[state.currentRoom].push(message);
            renderMessage(message);
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
    });

    // Voice Button (Mock)
    voiceBtn.addEventListener('click', () => {
        alert('ميزة التسجيل الصوتي قيد التطوير');
    });

    // Format Toolbar
    toggleFormatBtn.addEventListener('click', () => {
        formatToolbar.classList.toggle('hidden');
    });

    textColorBtn.addEventListener('click', () => {
        colorPicker.click();
    });

    colorPicker.addEventListener('change', (e) => {
        state.textColor = e.target.value;
        textColorBtn.style.color = e.target.value;
    });

    textSizeSelect.addEventListener('change', (e) => {
        state.textSize = e.target.value;
        messageInput.style.fontSize = e.target.value + 'px';
    });

    // Dark Mode
    darkModeToggle.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        document.documentElement.classList.toggle('dark');
        saveStorage();
        const icon = darkModeToggle.querySelector('i');
        icon.className = state.darkMode ? 'fa-solid fa-sun text-xl' : 'fa-solid fa-moon text-xl';
    });

    if (state.darkMode) {
        darkModeToggle.querySelector('i').className = 'fa-solid fa-sun text-xl';
    }

    // Mobile Users Drawer
    mobileUsersBtn.addEventListener('click', () => {
        mobileUsersDrawer.classList.remove('hidden');
    });

    closeMobileUsers.addEventListener('click', () => {
        mobileUsersDrawer.classList.add('hidden');
    });

    mobileUsersDrawer.addEventListener('click', (e) => {
        if (e.target === mobileUsersDrawer) {
            mobileUsersDrawer.classList.add('hidden');
        }
    });

    // Admin Panel
    adminPanelBtn.addEventListener('click', () => {
        adminModal.classList.remove('hidden');
    });

    closeAdminModal.addEventListener('click', () => {
        adminModal.classList.add('hidden');
    });

    adminModal.addEventListener('click', (e) => {
        if (e.target === adminModal) {
            adminModal.classList.add('hidden');
        }
    });

    // Admin Actions
    document.getElementById('kickUserBtn').addEventListener('click', () => {
        const username = prompt('أدخل اسم المستخدم للطرد:');
        if (username) kickUser(username);
        adminModal.classList.add('hidden');
    });

    document.getElementById('banUserBtn').addEventListener('click', () => {
        const username = prompt('أدخل اسم المستخدم للحظر:');
        if (username) banUser(username);
        adminModal.classList.add('hidden');
    });

    document.getElementById('muteUserBtn').addEventListener('click', () => {
        const username = prompt('أدخل اسم المستخدم للكتم:');
        if (username) muteUser(username);
        adminModal.classList.add('hidden');
    });

    document.getElementById('announcementBtn').addEventListener('click', () => {
        const text = prompt('أدخل نص الإعلان:');
        if (text) {
            state.announcement = text;
            showAnnouncement(text);
            saveStorage();
            addSystemMessage(`إعلان من الإدارة: ${text}`);
        }
        adminModal.classList.add('hidden');
    });

    document.getElementById('renameRoomBtn').addEventListener('click', () => {
        const newName = prompt('أدخل الاسم الجديد للغرفة:', state.currentRoom);
        if (newName && newName.trim()) {
            const oldName = state.currentRoom;
            const tab = document.querySelector(`[data-room="${oldName}"]`);
            if (tab) {
                tab.innerHTML = `<i class="fa-solid fa-flag ml-1"></i> ${newName}`;
                tab.dataset.room = newName;
            }
            state.messages[newName] = state.messages[oldName] || [];
            delete state.messages[oldName];
            state.currentRoom = newName;
            addSystemMessage(`تم تغيير اسم الغرفة إلى: ${newName}`);
        }
        adminModal.classList.add('hidden');
    });

    document.getElementById('invisibleModeBtn').addEventListener('click', () => {
        state.isInvisible = !state.isInvisible;
        if (state.isInvisible) {
            state.users = state.users.filter(u => u.username !== state.currentUser.username);
            alert('تم تفعيل الوضع الخفي');
        } else {
            state.users.push(state.currentUser);
            alert('تم إلغاء الوضع الخفي');
        }
        updateUsersList();
        adminModal.classList.add('hidden');
    });

    function kickUser(username) {
        if (!state.isOwner) return;
        state.users = state.users.filter(u => u.username !== username);
        updateUsersList();
        addSystemMessage(`تم طرد ${username} من الدردشة`);
    }

    function banUser(username) {
        if (!state.isOwner) return;
        if (!state.bannedUsers.includes(username)) {
            state.bannedUsers.push(username);
            saveStorage();
            kickUser(username);
            addSystemMessage(`تم حظر ${username} من الدردشة`);
        }
    }

    function muteUser(username) {
        if (!state.isOwner) return;
        if (!state.mutedUsers.includes(username)) {
            state.mutedUsers.push(username);
            saveStorage();
            addSystemMessage(`تم كتم ${username}`);
        }
    }

    function showAnnouncement(text) {
        announcementText.textContent = text;
        announcementBar.classList.remove('hidden');
    }

    closeAnnouncement.addEventListener('click', () => {
        if (state.isOwner) {
            announcementBar.classList.add('hidden');
            state.announcement = '';
            saveStorage();
        }
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
        if (confirm('هل تريد تسجيل الخروج؟')) {
            state.users = state.users.filter(u => u.username !== state.currentUser.username);
            state.currentUser = null;
            state.isOwner = false;
            adminPanelBtn.classList.add('hidden');
            chatApp.classList.add('hidden');
            loginPage.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
            messagesContainer.innerHTML = '';
        }
    });

    // Initialize
    initStorage();
    
    // Simulate online users
    const demoUsers = [
        { username: 'محمد', isOwner: false, joinTime: Date.now() },
        { username: 'أحمد', isOwner: false, joinTime: Date.now() },
        { username: 'فاطمة', isOwner: false, joinTime: Date.now() }
    ];
    
    setInterval(() => {
        if (state.currentUser && !state.isInvisible) {
            const randomOnline = 15 + Math.floor(Math.random() * 10);
            onlineCount.textContent = randomOnline + demoUsers.length;
        }
    }, 5000);

    // Welcome demo messages
    setTimeout(() => {
        if (state.messages['عامة'] && state.messages['عامة'].length === 0) {
            const demoMsgs = [
                { id: 1, username: 'محمد', text: 'السلام عليكم ورحمة الله', timestamp: '10:30', isOwner: false, color: '#000', size: '16', type: 'text' },
                { id: 2, username: 'أحمد', text: 'وعليكم السلام، أهلاً وسهلاً', timestamp: '10:31', isOwner: false, color: '#000', size: '16', type: 'text' },
            ];
            if (state.currentRoom === 'عامة') {
                demoMsgs.forEach(m => renderMessage(m));
            }
        }
    }, 1000);
</script>

</body>
</html>
