<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  * {
    font-family: 'Cairo', sans-serif;
  }
  
  .dark {
    color-scheme: dark;
  }

  .scrollbar-thin::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .scrollbar-thin::-webkit-scrollbar-track {
    background: transparent;
  }
  .scrollbar-thin::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 10px;
  }
  .dark .scrollbar-thin::-webkit-scrollbar-thumb {
    background: #555;
  }

  /* Login Background Animation */
  .login-bg {
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
  }
  
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* VIP Frames - 8 Levels */
  .vip-frame {
    position: relative;
    padding: 2px;
    border-radius: 12px;
    overflow: hidden;
  }

  .vip-frame::before {
    content: '';
    position: absolute;
    inset: -2px;
    z-index: -1;
    border-radius: 12px;
    animation: rotate 3s linear infinite;
  }

  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* VIP 1 - أحمر ناري */
  .vip-1::before {
    background: conic-gradient(from 0deg, #ff0000, #ff6b00, #ff0000, #ff6b00, #ff0000);
  }
  
  /* VIP 2 - وردي */
  .vip-2::before {
    background: conic-gradient(from 0deg, #ff1493, #ff69b4, #ff1493, #ff69b4, #ff1493);
  }
  
  /* VIP 3 - أسود ذهبي */
  .vip-3::before {
    background: conic-gradient(from 0deg, #000000, #ffd700, #000000, #ffd700, #000000);
  }
  
  /* VIP 4 - أحمر غامق */
  .vip-4::before {
    background: conic-gradient(from 0deg, #8b0000, #dc143c, #8b0000, #dc143c, #8b0000);
  }
  
  /* VIP 5 - أزرق */
  .vip-5::before {
    background: conic-gradient(from 0deg, #0000ff, #00bfff, #0000ff, #00bfff, #0000ff);
  }
  
  /* VIP 6 - أحمر بني */
  .vip-6::before {
    background: conic-gradient(from 0deg, #8b4513, #cd5c5c, #8b4513, #cd5c5c, #8b4513);
  }
  
  /* VIP 7 - برتقالي */
  .vip-7::before {
    background: conic-gradient(from 0deg, #ff8c00, #ffa500, #ff8c00, #ffa500, #ff8c00);
  }
  
  /* VIP 8 - أسود */
  .vip-8::before {
    background: conic-gradient(from 0deg, #000000, #2c2c2c, #000000, #4a4a4a, #000000);
  }

  /* Owner Frame - أحمر متحرك */
  .owner-frame {
    position: relative;
    padding: 2px;
    border-radius: 12px;
  }
  
  .owner-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    padding: 2px;
    background: linear-gradient(45deg, #ff0000, #ff6b00, #ff0000, #ff6b00);
    background-size: 300% 300%;
    animation: ownerGlow 2s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  @keyframes ownerGlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Name Effects */
  .name-glow-gold {
    background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2s linear infinite;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }

  .name-rainbow {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    font-weight: 700;
  }

  .name-stars {
    position: relative;
    font-weight: 700;
  }

  .name-stars::after {
    content: '✨';
    position: absolute;
    animation: stars 2s ease-in-out infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  @keyframes stars {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }

  .message-bubble {
    animation: slideIn 0.3s ease-out;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .emoji-btn {
    transition: transform 0.2s;
  }
  .emoji-btn:hover {
    transform: scale(1.3);
  }

  .admin-panel {
    backdrop-filter: blur(10px);
  }
</style>

<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

<!-- Login Screen -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center login-bg p-4">
  <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 w-full max-w-md transform transition-all">
    <div class="text-center mb-8">
      <div class="inline-block p-4 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl mb-4 shadow-lg">
        <i class="fas fa-comments text-white text-4xl"></i>
      </div>
      <h1 class="text-4xl font-bold text-gray-800 dark:text-white mb-2">شات عربي</h1>
      <p class="text-gray-500 dark:text-gray-400">دردشة عربية مجانية للجميع</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
          <i class="fas fa-user ml-2"></i>اسم المستخدم
        </label>
        <input type="text" id="username" required minlength="3" maxlength="20"
          class="w-full px-4 py-3 border-2 border-gray-300 dark:border-gray-600 rounded-xl focus:border-blue-500 dark:bg-gray-700 dark:text-white transition"
          placeholder="أدخل اسمك">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
          <i class="fas fa-lock ml-2"></i>كلمة المرور <span class="text-xs text-gray-400">(اختيارية)</span>
        </label>
        <input type="password" id="password"
          class="w-full px-4 py-3 border-2 border-gray-300 dark:border-gray-600 rounded-xl focus:border-blue-500 dark:bg-gray-700 dark:text-white transition"
          placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 rounded-xl hover:shadow-lg transform hover:scale-105 transition-all">
        <i class="fas fa-sign-in-alt ml-2"></i>دخول
      </button>

      <div class="flex gap-3">
        <button type="button" id="guestBtn" class="flex-1 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-bold py-3 rounded-xl hover:bg-gray-300 dark:hover:bg-gray-600 transition">
          <i class="fas fa-user-secret ml-2"></i>دخول كزائر
        </button>
        <button type="button" id="quickBtn" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition">
          <i class="fas fa-bolt ml-2"></i>دخول سريع
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400">
      <p>للحصول على صلاحيات المالك: الدعم الفني / 19951995</p>
    </div>
  </div>
</div>

<!-- Main Chat -->

  </header>

  <!-- Chat Area -->

    <!-- Users Sidebar -->
    <aside class="w-64 bg-white dark:bg-gray-800 border-l dark:border-gray-700 hidden lg:block overflow-y-auto scrollbar-thin">
      <div class="p-4">
        <h3 class="font-bold text-gray-800 dark:text-white mb-3 flex items-center">

        </h3>
        <div id="onlineUsers" class="space-y-2"></div>
      </div>
    </aside>

    <!-- Messages -->
    <main class="flex-1 flex flex-col bg-gray-50 dark:bg-gray-900">
      <div id="messagesContainer" class="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-3"></div>

      <!-- Message Input -->
      <div class="bg-white dark:bg-gray-800 border-t dark:border-gray-700 p-4">
        <div id="mutedAlert" class="hidden mb-3 p-3 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 rounded-lg text-center">
          <i class="fas fa-ban ml-2"></i>تم كتمك من المحادثة
        </div>

        <div class="flex items-center gap-2 mb-2">
          <div class="flex gap-2">
            <button id="emojiBtn" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition">

              <i class="fas fa-image text-xl"></i>
            </button>
            <select id="fontSizeSelect" class="px-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm dark:text-white">

              <option value="16" selected>عادي</option>
              <option value="18">كبير</option>
              <option value="20">كبير جداً</option>
            </select>
            <input type="color" id="textColor" value="#000000" class="w-10 h-10 rounded-lg cursor-pointer">
          </div>
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </div>

        <!-- Emoji Picker -->
        <div id="emojiPicker" class="hidden mb-2 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
          <div class="grid grid-cols-8 gap-2 text-2xl">
            <button class="emoji-btn">😀</button><button class="emoji-btn">😂</button><button class="emoji-btn">😍</button><button class="emoji-btn">😎</button>
            <button class="emoji-btn">😭</button><button class="emoji-btn">😡</button><button class="emoji-btn">👍</button><button class="emoji-btn">❤️</button>
            <button class="emoji-btn">🔥</button><button class="emoji-btn">💯</button><button class="emoji-btn">🎉</button><button class="emoji-btn">✨</button>

          <button id="sendBtn" class="px-6 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-xl hover:shadow-lg transition">

    apiKey: "AIzaSyAGpES78mV7-jgEQzi63R0TONGKfUQHFHc",
    authDomain: "hashed-cht.firebaseapp.com",
    databaseURL: "https://hashed-cht-default-rtdb.firebaseio.com",
    projectId: "hashed-cht",
    storageBucket: "hashed-cht.firebasestorage.app",
    messagingSenderId: "442699332645",
    appId: "1:442699332645:web:08d332758ac215a07453cc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  // State
  let currentUser = null;
  let currentRoom = 'عامة';
  let isOwner = false;
  let isMuted = false;
  let currentPrivateChat = null;
  let messageListeners = {};
  let privateListeners = {};

  // Elements
  const loginScreen = document.getElementById('loginScreen');
  const chatScreen = document.getElementById('chatScreen');
  const loginForm = document.getElementById('loginForm');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const guestBtn = document.getElementById('guestBtn');
  const quickBtn = document.getElementById('quickBtn');
  const messagesContainer = document.getElementById('messagesContainer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const themeToggle = document.getElementById('themeToggle');
  const onlineUsers = document.getElementById('onlineUsers');
  const onlineCount = document.getElementById('onlineCount');
  const adminPanelBtn = document.getElementById('adminPanelBtn');
  const adminPanel = document.getElementById('adminPanel');
  const closeAdminBtn = document.getElementById('closeAdminBtn');
  const emojiBtn = document.getElementById('emojiBtn');
  const emojiPicker = document.getElementById('emojiPicker');
  const imageBtn = document.getElementById('imageBtn');
  const imageInput = document.getElementById('imageInput');
  const mutedAlert = document.getElementById('mutedAlert');
  const announcementBar = document.getElementById('announcementBar');
  const announcementText = document.getElementById('announcementText');

  // Theme
  const initTheme = () => {
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  };
  initTheme();

  themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  });

  // Login
  const login = async (username, password = '') => {
    if (!username || username.length < 3) {
      alert('اسم المستخدم يجب أن يكون 3 أحرف على الأقل');
      return;
    }

    try {
      const userCredential = await signInAnonymously(auth);
      const uid = userCredential.user.uid;
      
      // Check if owner
      if (username === 'الدعم الفني' && password === '19951995') {
        isOwner = true;
        await set(ref(db, `admins/${uid}`), { username, isOwner: true, timestamp: serverTimestamp() });
      } else {
        // Check if banned
        const bannedSnap = await new Promise(resolve => {
          onValue(ref(db, `banned/${username}`), resolve, { onlyOnce: true });
        });
        if (bannedSnap.exists()) {
          alert('تم حظرك من الدردشة');
          return;
        }
      }

      currentUser = { uid, username, isOwner };

      // Save user data
      await set(ref(db, `users/${username}`), {
        uid,
        username,
        lastActive: serverTimestamp()
      });

      // Set online status
      await set(ref(db, `online/${uid}`), {
        username,
        isOwner,
        room: currentRoom,
        timestamp: serverTimestamp()
      });
      onDisconnect(ref(db, `online/${uid}`)).remove();

      // Check if muted
      onValue(ref(db, `muted/${username}`), (snap) => {
        isMuted = snap.exists();
        mutedAlert.classList.toggle('hidden', !isMuted);
        messageInput.disabled = isMuted;
        sendBtn.disabled = isMuted;
      });

      loginScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');

      if (isOwner) {
        adminPanelBtn.classList.remove('hidden');
      }

      initChat();
    } catch (error) {
      console.error('Login error:', error);
      alert('حدث خطأ في تسجيل الدخول');
    }
  };

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    login(usernameInput.value.trim(), passwordInput.value);
  });

  guestBtn.addEventListener('click', () => {
    const guestName = `زائر_${Math.floor(Math.random() * 9999)}`;
    login(guestName);
  });

  quickBtn.addEventListener('click', () => {
    const quickName = `عضو_${Math.floor(Math.random() * 9999)}`;
    login(quickName);
  });

  // Init Chat
  const initChat = () => {
    loadMessages(currentRoom);
    loadOnlineUsers();
    loadAnnouncement();
    if (isOwner) {
      loadAdminPanel();
    }
  };

  // Rooms
  document.querySelectorAll('.room-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.room-tab').forEach(t => {
        t.classList.remove('active', 'bg-blue-500', 'text-white');
        t.classList.add('bg-gray-200', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
      });
      tab.classList.add('active', 'bg-blue-500', 'text-white');
      tab.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
      
      currentRoom = tab.dataset.room;
      messagesContainer.innerHTML = '';
      loadMessages(currentRoom);
      
      if (currentUser) {
        update(ref(db, `online/${currentUser.uid}`), { room: currentRoom });
      }
    });
  });

  // Load Messages
  const loadMessages = (room) => {
    if (messageListeners[room]) return;
    
    const roomRef = ref(db, `rooms/${room}/messages`);
    messageListeners[room] = onChildAdded(roomRef, (snapshot) => {
      const msg = snapshot.val();
      const msgId = snapshot.key;
      displayMessage(msg, msgId, false);
    });
  };

  // Display Message
  const displayMessage = async (msg, msgId, isPrivate = false) => {
    const container = isPrivate ? document.getElementById('privateMessages') : messagesContainer;
    
    // Get VIP data
    const vipSnap = await new Promise(resolve => {
      onValue(ref(db, `users/${msg.username}/vip`), resolve, { onlyOnce: true });
    });
    const vip = vipSnap.val();
    
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message-bubble';
    msgDiv.dataset.msgId = msgId;
    
    const isCurrentUser = msg.username === currentUser.username;
    const isOwnerMsg = msg.isOwner;
    
    let frameClass = '';
    if (isOwnerMsg) {
      frameClass = 'owner-frame';
    } else if (vip && vip.level > 0) {
      frameClass = `vip-frame vip-${vip.level}`;
    }
    
    const nameClass = vip?.effect || '';
    const displayName = vip?.displayName || msg.username;
    
    msgDiv.innerHTML = `
      <div class="flex ${isCurrentUser ? 'justify-end' : 'justify-start'}">
        <div class="max-w-md ${frameClass}">
          <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-3 ${isCurrentUser ? 'bg-blue-50 dark:bg-blue-900' : ''}">
            <div class="flex items-center justify-between mb-1">
              <span class="font-bold text-sm ${nameClass}">
                ${isOwnerMsg ? '<i class="fas fa-crown text-yellow-500"></i> ' : ''}
                ${vip?.level > 0 ? '<i class="fas fa-gem text-purple-500"></i> ' : ''}
                ${displayName}
                ${vip?.number ? `<span class="text-xs bg-yellow-400 text-black px-1 rounded">${vip.number}</span>` : ''}
                ${isOwnerMsg ? ' <span class="text-xs bg-red-500 text-white px-2 py-0.5 rounded-full">المالك</span>' : ''}
              </span>
              <span class="text-xs text-gray-500 dark:text-gray-400">${new Date(msg.timestamp).toLocaleTimeString('ar-SA', {hour: '2-digit', minute: '2-digit'})}</span>
            </div>
            <div class="text-gray-800 dark:text-gray-200" style="font-size: ${msg.fontSize || 16}px; color: ${msg.color || 'inherit'}">
              ${msg.image ? `<img src="${msg.image}" class="rounded-lg mb-2 max-w-full max-h-64 object-cover">` : ''}
              ${escapeHtml(msg.text)}
            </div>
            ${isOwner ? `
              <button class="delete-msg-btn text-xs text-red-500 hover:text-red-700 mt-2" data-room="${currentRoom}" data-msgid="${msgId}">
                <i class="fas fa-trash"></i> حذف
              </button>
            ` : ''}
          </div>
        </div>
      </div>
    `;
    
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
    
    // Delete button
    if (isOwner) {
      msgDiv.querySelector('.delete-msg-btn')?.addEventListener('click', (e) => {
        const room = e.target.closest('button').dataset.room;
        const msgId = e.target.closest('button').dataset.msgid;
        if (confirm('هل تريد حذف هذه الرسالة؟')) {
          remove(ref(db, `rooms/${room}/messages/${msgId}`));
          msgDiv.remove();
        }
      });
    }
  };

  // Send Message
  const sendMessage = async (privateTo = null) => {
    const input = privateTo ? document.getElementById('privateInput') : messageInput;
    const text = input.value.trim();
    
    if (!text || isMuted) return;
    
    const msgData = {
      username: currentUser.username,
      text,
      isOwner,
      timestamp: serverTimestamp(),
      fontSize: document.getElementById('fontSizeSelect').value,
      color: document.getElementById('textColor').value
    };
    
    if (privateTo) {
      const chatId = [currentUser.username, privateTo].sort().join('_');
      await push(ref(db, `private/${chatId}`), msgData);
      input.value = '';
    } else {
      await push(ref(db, `rooms/${currentRoom}/messages`), msgData);
      input.value = '';
    }
  };

  sendBtn.addEventListener('click', () => sendMessage());
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Image Upload
  imageBtn.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async (event) => {
      const base64 = event.target.result;
      await push(ref(db, `rooms/${currentRoom}/messages`), {
        username: currentUser.username,
        text: '',
        image: base64,
        isOwner,
        timestamp: serverTimestamp()
      });
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // Emoji Picker
  emojiBtn.addEventListener('click', () => {
    emojiPicker.classList.toggle('hidden');
  });

  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      messageInput.value += btn.textContent;
      emojiPicker.classList.add('hidden');
      messageInput.focus();
    });
  });

  // Online Users
  const loadOnlineUsers = () => {
    onValue(ref(db, 'online'), async (snapshot) => {
      onlineUsers.innerHTML = '';
      let count = 0;
      
      const users = [];
      snapshot.forEach((child) => {
        users.push({ uid: child.key, ...child.val() });
        count++;
      });
      
      onlineCount.innerHTML = `<i class="fas fa-circle text-green-500 text-xs ml-1"></i>${count} متواجد`;
      
      for (const user of users) {
        const vipSnap = await new Promise(resolve => {
          onValue(ref(db, `users/${user.username}/vip`), resolve, { onlyOnce: true });
        });
        const vip = vipSnap.val();
        
        const userDiv = document.createElement('div');
        const frameClass = user.isOwner ? 'owner-frame' : (vip?.level > 0 ? `vip-frame vip-${vip.level}` : '');
        const nameClass = vip?.effect || '';
        const displayName = vip?.displayName || user.username;
        
        userDiv.className = `p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer transition ${frameClass}`;
        userDiv.innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-lg p-2">
            <div class="flex items-center gap-2">
              <div class="w-2 h-2 bg-green-500 rounded-full"></div>
              <span class="text-sm font-semibold ${nameClass}">
                ${user.isOwner ? '<i class="fas fa-crown text-yellow-500 text-xs"></i> ' : ''}
                ${displayName}
              </span>
            </div>
            <div class="text-xs text-gray-500 dark:text-gray-400 mr-4">${user.room}</div>
          </div>
        `;
        
        if (user.username !== currentUser.username) {
          userDiv.addEventListener('click', () => openPrivateChat(user.username));
        }
        
        onlineUsers.appendChild(userDiv);
      }
    });
  };

  // Private Chat
  const openPrivateChat = (username) => {
    currentPrivateChat = username;
    document.getElementById('privateChatName').textContent = username;
    document.getElementById('privateModal').classList.remove('hidden');
    
    const chatId = [currentUser.username, username].sort().join('_');
    const privateMessages = document.getElementById('privateMessages');
    privateMessages.innerHTML = '';
    
    if (privateListeners[chatId]) return;
    
    privateListeners[chatId] = onChildAdded(ref(db, `private/${chatId}`), (snapshot) => {
      displayMessage(snapshot.val(), snapshot.key, true);
    });
  };

  document.getElementById('closePrivateBtn').addEventListener('click', () => {
    document.getElementById('privateModal').classList.add('hidden');
    currentPrivateChat = null;
  });

  document.getElementById('sendPrivateBtn').addEventListener('click', () => {
    if (currentPrivateChat) sendMessage(currentPrivateChat);
  });

  document.getElementById('privateInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && currentPrivateChat) sendMessage(currentPrivateChat);
  });

  // Announcement
  const loadAnnouncement = () => {
    onValue(ref(db, 'announcement'), (snapshot) => {
      if (snapshot.exists()) {
        announcementText.textContent = snapshot.val().text;
        announcementBar.classList.remove('hidden');
      } else {
        announcementBar.classList.add('hidden');
      }
    });
  };

  // Admin Panel
  adminPanelBtn.addEventListener('click', () => {
    adminPanel.classList.remove('hidden');
  });

  closeAdminBtn.addEventListener('click', () => {
    adminPanel.classList.add('hidden');
  });

  document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.admin-tab').forEach(t => {
        t.classList.remove('active', 'border-red-500', 'text-red-500');
        t.classList.add('text-gray-600', 'dark:text-gray-400');
      });
      document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.add('hidden'));
      
      tab.classList.add('active', 'border-red-500', 'text-red-500');
      document.getElementById(`${tab.dataset.tab}Tab`).classList.remove('hidden');
    });
  });

  const loadAdminPanel = () => {
    // Load users for management
    onValue(ref(db, 'online'), (snapshot) => {
      const adminUsersList = document.getElementById('adminUsersList');
      const vipUserSelect = document.getElementById('vipUserSelect');
      adminUsersList.innerHTML = '';
      vipUserSelect.innerHTML = '<option value="">اختر العضو</option>';
      
      snapshot.forEach((child) => {
        const user = child.val();
        if (user.username === currentUser.username) return;
        
        const userDiv = document.createElement('div');
        userDiv.className = 'flex items-center justify-between p-3 bg-gray-100 dark:bg-gray-700 rounded-lg';
        userDiv.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-semibold dark:text-white">${user.username}</span>
            ${user.isOwner ? '<span class="text-xs bg-red-500 text-white px-2 py-1 rounded">مالك</span>' : ''}
          </div>
          <div class="flex gap-2">
            <button class="kick-btn px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm" data-username="${user.username}">طرد</button>
            <button class="ban-btn px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-sm" data-username="${user.username}">حظر</button>
            <button class="mute-btn px-3 py-1 bg-orange-500 text-white rounded hover:bg-orange-600 text-sm" data-username="${user.username}">كتم</button>
          </div>
        `;
        adminUsersList.appendChild(userDiv);
        
        const option = document.createElement('option');
        option.value = user.username;
        option.textContent = user.username;
        vipUserSelect.appendChild(option);
      });
      
      // Add event listeners
      document.querySelectorAll('.kick-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const username = btn.dataset.username;
          if (confirm(`طرد ${username}؟`)) {
            const onlineSnap = await new Promise(resolve => {
              onValue(ref(db, 'online'), resolve, { onlyOnce: true });
            });
            onlineSnap.forEach(child => {
              if (child.val().username === username) {
                remove(ref(db, `online/${child.key}`));
              }
            });
            alert('تم الطرد');
          }
        });
      });
      
      document.querySelectorAll('.ban-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const username = btn.dataset.username;
          if (confirm(`حظر ${username}؟`)) {
            await set(ref(db, `banned/${username}`), { timestamp: serverTimestamp() });
            alert('تم الحظر');
          }
        });
      });
      
      document.querySelectorAll('.mute-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const username = btn.dataset.username;
          const mutedSnap = await new Promise(resolve => {
            onValue(ref(db, `muted/${username}`), resolve, { onlyOnce: true });
          });
          if (mutedSnap.exists()) {
            await remove(ref(db, `muted/${username}`));
            alert('تم إلغاء الكتم');
          } else {
            await set(ref(db, `muted/${username}`), { timestamp: serverTimestamp() });
            alert('تم الكتم');
          }
        });
      });
    });
    
    // Announcement management
    document.getElementById('setAnnouncementBtn').addEventListener('click', async () => {
      const text = document.getElementById('announcementInput').value.trim();
      if (text) {
        await set(ref(db, 'announcement'), { text, timestamp: serverTimestamp() });
        alert('تم تثبيت الإعلان');
        document.getElementById('announcementInput').value = '';
      }
    });
    
    document.getElementById('deleteAnnouncementBtn').addEventListener('click', async () => {
      if (confirm('حذف الإعلان؟')) {
        await remove(ref(db, 'announcement'));
        alert('تم حذف الإعلان');
      }
    });
    
    // VIP Management
    document.getElementById('grantVipBtn').addEventListener('click', async () => {
      const username = document.getElementById('vipUserSelect').value;
      const level = parseInt(document.getElementById('vipLevelSelect').value);
      const displayName = document.getElementById('vipName').value.trim();
      const effect = document.getElementById('vipEffect').value;
      const number = parseInt(document.getElementById('vipNumber').value);
      
      if (!username) {
        alert('اختر عضو');
        return;
      }
      
      await set(ref(db, `users/${username}/vip`), {
        level,
        displayName: displayName || username,
        effect,
        number: number || null,
        grantedBy: currentUser.username,
        timestamp: serverTimestamp()
      });
      
      alert('تم منح VIP بنجاح');
    });
    
    // Private Messages Monitoring
    loadPrivateMessagesMonitor();
  };

  const loadPrivateMessagesMonitor = () => {
    onValue(ref(db, 'private'), (snapshot) => {
      const container = document.getElementById('privateMessagesList');
      container.innerHTML = '';
      
      snapshot.forEach((chatSnap) => {
        const chatId = chatSnap.key;
        const chatDiv = document.createElement('div');
        chatDiv.className = 'bg-gray-100 dark:bg-gray-700 rounded-lg p-4';
        
        let messagesHtml = `<h4 class="font-bold mb-2 dark:text-white">محادثة: ${chatId.replace('_', ' ↔ ')}</h4><div class="space-y-2 max-h-64 overflow-y-auto scrollbar-thin">`;
        
        chatSnap.forEach((msgSnap) => {
          const msg = msgSnap.val();
          messagesHtml += `
            <div class="bg-white dark:bg-gray-800 p-2 rounded text-sm">
              <span class="font-semibold text-blue-600 dark:text-blue-400">${msg.username}:</span>
              <span class="dark:text-gray-300">${escapeHtml(msg.text)}</span>
            </div>
          `;
        });
        
        messagesHtml += '</div>';
        chatDiv.innerHTML = messagesHtml;
        container.appendChild(chatDiv);
      });
    });
  };

  // Logout
  logoutBtn.addEventListener('click', async () => {
    if (confirm('هل تريد تسجيل الخروج؟')) {
      if (currentUser) {
        await remove(ref(db, `online/${currentUser.uid}`));
      }
      location.reload();
    }
  });

  // Utils
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
