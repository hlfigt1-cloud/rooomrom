<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة عربية</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
* { font-family: 'Cairo', sans-serif; }
.owner-name { 
  background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); 
  background-size: 200% auto;
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent; 
  animation: rainbow 3s linear infinite; 
  font-weight: 900; 
}
@keyframes rainbow { 
  to { background-position: 200% center; } 
}
.chat-bg {
  background-image: linear-gradient(rgba(17,24,39,0.95), rgba(17,24,39,0.95)), 
  url('https://i.ibb.co/6n0hLxP/bg-pattern.png');
}
</style>
</head>
<body class="bg-gray-900 text-white chat-bg">
<div id="app" class="h-screen flex flex-col">
  
  <!-- شاشة تسجيل الدخول -->
  <div id="login" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800/90 backdrop-blur p-8 rounded-2xl w-full max-w-md border border-purple-500/30">
      <h1 class="text-3xl font-bold text-center mb-2 text-purple-400">دردشة عربية</h1>
      <p class="text-center text-gray-400 mb-8">مرحباً بك في غرفة الدردشة</p>
      <input id="username" type="text" placeholder="اسم المستخدم" class="w-full p-3 mb-4 bg-gray-700 rounded-lg text-white border border-gray-600 focus:border-purple-500 outline-none">
      <input id="password" type="password" placeholder="كلمة المرور - للمالك فقط" class="w-full p-3 mb-6 bg-gray-700 rounded-lg text-white border border-gray-600 focus:border-purple-500 outline-none">
      <button onclick="login()" class="w-full p-3 bg-purple-600 hover:bg-purple-700 rounded-lg font-bold transition">دخول للدردشة</button>
      <p class="text-xs text-gray-500 mt-4 text-center">الاعضاء يدخلون بالاسم فقط</p>
    </div>
  </div>

  <!-- شاشة الدردشة -->
  <div id="chat" class="hidden h-screen flex-col">
    <div class="bg-gray-800/90 backdrop-blur p-3 flex justify-between items-center border-b border-gray-700">
      <div>
        <h2 class="font-bold text-lg">غرفة الدردشة</h2>
        <span id="userDisplay" class="text-sm"></span>
      </div>
      <div class="flex gap-2">
        <button onclick="clearChat()" id="clearBtn" class="hidden px-3 py-1 bg-red-600 hover:bg-red-700 rounded-lg text-sm">مسح الكل</button>
        <button onclick="logout()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm">خروج</button>
      </div>
    </div>
    
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    
    <div class="bg-gray-800/90 backdrop-blur p-3 flex gap-2 border-t border-gray-700">
      <input id="msgInput" type="text" placeholder="اكتب رسالتك..." class="flex-1 p-3 bg-gray-700 rounded-lg border border-gray-600 focus:border-purple-500 outline-none">
      <button onclick="sendMsg()" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-lg font-bold transition">ارسال</button>
    </div>
  </div>
</div>

<script>
let currentUser = '';
let currentRole = 'member';
let messages = JSON.parse(localStorage.getItem('chat_msgs') || '[]');

function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  
  if (!u) return alert('اكتب اسم المستخدم');
  
  currentUser = u;
  // اذا الاسم "الدعم الفني" والباسورد صح = مالك
  currentRole = (u === 'الدعم الفني' && p === '19952005') ? 'owner' : 'member';
  
  localStorage.setItem('chat_user', JSON.stringify({u, r: currentRole}));
  showChat();
}

function showChat() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('chat').classList.remove('hidden');
  document.getElementById('chat').classList.add('flex');
  
  const badge = currentRole === 'owner' ? '👑 المالك' : '👤 عضو';
  const nameClass = currentRole === 'owner' ? 'owner-name' : 'text-purple-400';
  document.getElementById('userDisplay').innerHTML = `<span class="${nameClass}">${currentUser}</span> • ${badge}`;
  
  if (currentRole === 'owner') {
    document.getElementById('clearBtn').classList.remove('hidden');
  }
  
  renderMsgs();
}

function sendMsg() {
  const txt = document.getElementById('msgInput').value.trim();
  if (!txt) return;
  
  messages.push({
    u: currentUser, 
    r: currentRole, 
    t: txt, 
    time: new Date().toLocaleTimeString('ar-IQ', {hour: '2-digit', minute:'2-digit'})
  });
  
  localStorage.setItem('chat_msgs', JSON.stringify(messages));
  document.getElementById('msgInput').value = '';
  renderMsgs();
}

function renderMsgs() {
  const msgBox = document.getElementById('messages');
  msgBox.innerHTML = messages.map((m, i) => `
    <div class="bg-gray-800/70 backdrop-blur p-3 rounded-lg border border-gray-700/50">
      <div class="flex justify-between items-center mb-1">
        <span class="font-bold ${m.r === 'owner' ? 'owner-name' : 'text-blue-400'}">
          ${m.r === 'owner' ? '👑' : '👤'} ${m.u}
        </span>
        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-500">${m.time}</span>
          ${currentRole === 'owner' ? `<button onclick="deleteMsg(${i})" class="text-red-500 hover:text-red-400 text-xs">حذف</button>` : ''}
        </div>
      <p class="text-gray-200 break-words">${m.t}</p>
    </div>
  `).join('');
  msgBox.scrollTop = msgBox.scrollHeight;
}

function deleteMsg(index) {
  if (currentRole !== 'owner') return;
  if (confirm('حذف الرسالة؟')) {
    messages.splice(index, 1);
    localStorage.setItem('chat_msgs', JSON.stringify(messages));
    renderMsgs();
  }
}

function clearChat() {
  if (currentRole !== 'owner') return;
  if (confirm('مسح كل الرسائل؟ لا يمكن التراجع!')) {
    messages = [];
    localStorage.setItem('chat_msgs', JSON.stringify(messages));
    renderMsgs();
  }
}

function logout() {
  localStorage.removeItem('chat_user');
  location.reload();
}

// تسجيل دخول تلقائي اذا مسجل من قبل
const saved = localStorage.getItem('chat_user');
if (saved) {
  const data = JSON.parse(saved);
  currentUser = data.u;
  currentRole = data.r;
  showChat();
}

// ارسال بالانتر
document.getElementById('msgInput')?.addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMsg();
});
</script>
</body>
</html>
