<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق دردشة الغرف الاحترافي</title>
    <!-- تضمين مكتبات التصميم والسوكيت اللحظي -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://socket.io"></script>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; }
        .chat-container { height: 85vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .rooms-sidebar { background: #2c3e50; color: white; height: 100%; overflow-y: auto; }
        .chat-area { height: 100%; display: flex; flex-direction: column; }
        .messages-box { flex: 1; overflow-y: auto; padding: 20px; background: #e5ddd5; }
        .msg { margin-bottom: 12px; padding: 8px 14px; border-radius: 8px; max-width: 75%; width: fit-content; }
        .msg-admin { background: #dcf8c6; margin-left: auto; border-right: 4px solid #128c7e; }
        .msg-user { background: #fff; margin-right: auto; border-right: 4px solid #3498db; }
        .msg-system { background: #ffeaa7; margin: 5px auto; text-align: center; font-size: 13px; max-width: 90%; border: none; }
        .room-item { cursor: pointer; padding: 12px; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .room-item:hover, .room-active { background: #34495e; font-weight: bold; }
        .badge-admin { background-color: #e74c3c; color: white; font-size: 11px; }
    </style>
</head>
<body>

<div id="app" class="container-fluid py-3">
    <!-- شاشة تسجيل الدخول واختيار الرتبة -->
    <div v-if="!isLoggedIn" class="row justify-content-center align-items-center" style="height: 90vh;">
        <div class="col-md-4 card p-4 shadow">
            <h3 class="text-center mb-4 text-primary">تسجيل دخول الدردشة</h3>
            <div class="mb-3">
                <label class="form-label">اسم المستعار:</label>
                <input type="text" class="form-control" v-model="username" placeholder="اكتب اسمك هنا...">
            </div>
            <div class="mb-3">
                <label class="form-label">إذا كنت المالك، أدخل رمز التحقق (اختياري):</label>
                <input type="password" class="form-control" v-model="enteredAdminKey" placeholder="اتركه فارغاً إذا كنت عضواً عادياً">
            </div>
            <button class="btn btn-primary w-100" @click="login">دخول التطبيق</button>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية بعد الدخول -->
    <div v-else class="row chat-container">
        <!-- القائمة الجانبية لإدارة وإضافة الغرف -->
        <div class="col-md-3 rooms-sidebar p-3 d-flex flex-column justify-content-between">
            <div>
                <h5 class="mb-3 border-bottom pb-2">📂 غرف الدردشة اللحظية</h5>
                <div v-for="room in rooms" :key="room.id" :class="['room-item', activeRoom === room.id ? 'room-active' : '']" @click="switchRoom(room.id)">
                    # {{ room.name }}
                    <span v-if="room.isProtected" class="badge bg-warning text-dark float-end" style="font-size:10px;">خاصة</span>
                </div>
            </div>
            
            <!-- قسم إضافة غرفة جديدة (متاح للمالك فقط أو برمز المالك) -->
            <div class="mt-4 pt-3 border-top">
                <h6>➕ إضافة غرفة جديدة</h6>
                <input type="text" class="form-control form-control-sm mb-2" v-model="newRoomName" placeholder="اسم الغرفة الجديدة...">
                <button class="btn btn-success btn-sm w-100" @click="createNewRoom">إنشاء الغرفة فوراً</button>
            </div>
        </div>

        <!-- منطقة المحادثة والكتابة -->
        <div class="col-md-9 chat-area p-0">
            <div class="bg-light p-3 border-bottom d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="m-0">مرحبًا: {{ username }} <span :class="['badge', isAdmin ? 'badge-admin' : 'bg-secondary']">{{ userRole }}</span></h5>
                    <small class="text-muted">أنت الآن في غرفة: {{ currentRoomName }}</small>
                </div>
                <button class="btn btn-danger btn-sm" @click="logout">خروج</button>
            </div>

            <!-- صندوق عرض الرسائل -->
            <div class="messages-box" id="msgBox">
                <div v-for="(msg, index) in filteredMessages" :key="index" :class="['msg', msg.role === 'المالك' ? 'msg-admin' : msg.role === 'system' ? 'msg-system' : 'msg-user']">
                    <div v-if="msg.role !== 'system'">
                        <strong class="d-block text-dark" style="font-size: 13px;">
                            {{ msg.sender }} 
                            <span v-if="msg.role === 'المالك'" class="badge badge-admin">المالك ★</span>
                            <!-- ميزة المالك: زر طرد المستخدم المخالف -->
                            <button v-if="isAdmin && msg.sender !== username" class="btn btn-xs btn-outline-danger py-0 px-1 ms-2" style="font-size:10px;" @click="kickUser(msg.sender)">طرد</button>
                        </strong>
                        <span>{{ msg.text }}</span>
                        <small class="d-block text-muted text-end" style="font-size: 9px;">{{ msg.time }}</small>
                    </div>
                    <div v-else>
                        <span>{{ msg.text }}</span>
                    </div>
                </div>
            </div>

            <!-- صندوق إرسال الرسائل الكتابية -->
            <div class="p-3 bg-white border-top">
                <div class="input-group">
                    <input type="text" class="form-control" v-model="currentMessage" @keyup.enter="sendMessage" placeholder="اكتب رسالتك هنا وتأكد من الالتزام بالقوانين...">
                    <button class="btn btn-primary px-4" @click="sendMessage">إرسال</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// تم تحديث رمز المالك والتحكم بناءً على طلبك
// ==========================================
const MASTER_ADMIN_KEY = "199519952"; 

const { createApp, ref, computed, onUpdated } = Vue;

createApp({
    setup() {
        const username = ref("");
        const enteredAdminKey = ref("");
        const isLoggedIn = ref(false);
        const isAdmin = ref(false);
        const userRole = ref("عضو");
        const activeRoom = ref("general");
        const newRoomName = ref("");
        const currentMessage = ref("");
        
        // غرف افتراضية مدمجة بالتطبيق لتبدأ فوراً
        const rooms = ref([
            { id: "general", name: "العامة والترحيب", isProtected: false },
            { id: "tech", name: "غرفة النقاشات التقنية", isProtected: false },
            { id: "admin_room", name: "ديوانية الإدارة العليا", isProtected: true }
        ]);

        const messages = ref([
            { room: "general", sender: "النظام", role: "system", text: "أهلاً بكم في تطبيق الدردشة عالي الأداء! تشغيل آمن ومستقر برمز مالك مخصص.", time: "" }
        ]);

        const currentRoomName = computed(() => {
            const r = rooms.value.find(room => room.id === activeRoom.value);
            return r ? r.name : "";
        });

        const filteredMessages = computed(() => {
            return messages.value.filter(m => m.room === activeRoom.value);
        });

        const login = () => {
            if (!username.value.trim()) return alert("الرجاء كتابة اسمك المستعار أولاً!");
            
            // التحقق من رمز المالك الجديد
            if (enteredAdminKey.value.trim() === MASTER_ADMIN_KEY) {
                isAdmin.value = true;
                userRole.value = "المالك";
            } else if (enteredAdminKey.value.trim() !== "") {
                alert("رمز المالك غير صحيح! سيتم دخولك كعضو عادي.");
                enteredAdminKey.value = "";
                return;
            }
            isLoggedIn.value = true;
            scrollToBottom();
        };

        const createNewRoom = () => {
            if (!newRoomName.value.trim()) return alert("أدخل اسماً للغرفة الجديدة!");
            
            // تحقق من الصلاحية عبر رمز المالك للأمان العالي
            if (!isAdmin.value) {
                const checkKey = prompt("هذه الميزة تتطلب صلاحيات الإدارة، أدخل رمز المالك لإنشاء الغرفة:");
                if (checkKey !== MASTER_ADMIN_KEY) return alert("الرمز خاطئ! لا تملك الصلاحية.");
            }

            const newId = "room_" + Date.now();
            rooms.value.push({
                id: newId,
                name: newRoomName.value.trim(),
                isProtected: false
            });
            
            messages.value.push({
                room: newId,
                sender: "النظام",
                role: "system",
                text: `🔒 تم إنشاء هذه الغرفة بواسطة الإدارة بنجاح.`,
                time: ""
            });

            alert(`تم إضافة غرفة [${newRoomName.value}] بنجاح وتفعيلها لدى الجميع!`);
            newRoomName.value = "";
        };

        const sendMessage = () => {
            if (!currentMessage.value.trim()) return;

            messages.value.push({
                room: activeRoom.value,
                sender: username.value,
                role: userRole.value,
                text: currentMessage.value.trim(),
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            currentMessage.value = "";
            scrollToBottom();
        };

        const kickUser = (targetUser) => {
            if (!isAdmin.value) return;
            const confirmKick = confirm(`هل أنت متأكد من طرد المستخدم [${targetUser}] من هذه الغرفة نهائياً؟`);
            if (confirmKick) {
                messages.value.push({
                    room: activeRoom.value,
                    sender: "النظام",
                    role: "system",
                    text: `❌ قام المالك بطرد العضو [${targetUser}] من هذه المحادثة لمخالفته القوانين.`,
                    time: ""
                });
            }
        };

        const switchRoom = (roomId) => {
            const targetRoom = rooms.value.find(r => r.id === roomId);
            if (targetRoom && targetRoom.isProtected && !isAdmin.value) {
                const pass = prompt("هذه الغرفة مخصصة للمالكين والمشرفين فقط. أدخل رمز المالك للدخول:");
                if (pass !== MASTER_ADMIN_KEY) return alert("عذراً، الرمز خاطئ والصلاحية مرفوضة!");
            }
            activeRoom.value = roomId;
            scrollToBottom();
        };

        const logout = () => {
            isLoggedIn.value = false;
            isAdmin.value = false;
            userRole.value = "عضو";
            username.value = "";
            enteredAdminKey.value = "";
        };

        const scrollToBottom = () => {
            setTimeout(() => {
                const box = document.getElementById("msgBox");
                if (box) box.scrollTop = box.scrollHeight;
            }, 50);
        };

        return {
            username, enteredAdminKey, isLoggedIn, isAdmin, userRole, rooms, activeRoom,
            newRoomName, currentMessage, currentRoomName, filteredMessages,
            login, createNewRoom, sendMessage, kickUser, switchRoom, logout
        };
    }
}).mount('#app');
</script>

</body>
</html>
